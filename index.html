<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6fb0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c1420" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="生理学学习">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="生理学每日学习助手移动离线版：123 天知识点计划，今日任务、答题、制卡、统计，数据本机保存。">
<title>生理学每日学习助手 · 移动版</title>
<style>
/* 生理学每日学习助手 · 移动版 —— 移动端优先样式，无任何外部依赖 */
:root {
  --accent: #2f6fb0;
  --accent-strong: #23578f;
  --accent-soft: rgba(47, 111, 176, 0.10);
  --accent-line: rgba(47, 111, 176, 0.26);

  --bg: #f4f7fc;
  --surface: #ffffff;
  --surface-2: #eef2fa;
  --text: #17253f;
  --muted: #5b6b86;
  --line: #e2e8f3;

  --ok: #2f9e6a;
  --ok-soft: rgba(47, 158, 106, 0.12);
  --warn: #b9761a;
  --warn-soft: rgba(185, 118, 26, 0.13);
  --danger: #bf4238;
  --danger-soft: rgba(191, 66, 56, 0.12);

  --radius: 16px;
  --radius-sm: 10px;
  --shadow: 0 2px 12px rgba(18, 70, 80, 0.06);
  --shadow-lift: 0 6px 20px rgba(18, 70, 80, 0.10);

  --fs-body: 16px;
  --fs-title: 22px;
  --fs-h2: 18px;
  --fs-sm: 14px;
  --fs-xs: 12.5px;
  --lh: 1.65;
  --tap: 44px;
  --tabbar-h: 58px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --accent: #6fa8e8;
    --accent-strong: #93c2f5;
    --accent-soft: rgba(111, 168, 232, 0.16);
    --accent-line: rgba(111, 168, 232, 0.34);

    --bg: #0c1420;
    --surface: #141d2c;
    --surface-2: #1b2637;
    --text: #e4ecf8;
    --muted: #9fb0c9;
    --line: #26344a;

    --ok: #4fbf8b;
    --ok-soft: rgba(79, 191, 139, 0.16);
    --warn: #dda14d;
    --warn-soft: rgba(221, 161, 77, 0.16);
    --danger: #e0705f;
    --danger-soft: rgba(224, 112, 95, 0.16);

    --shadow: 0 2px 12px rgba(4, 10, 24, 0.42);
    --shadow-lift: 0 6px 20px rgba(4, 10, 24, 0.52);
  }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html {
  -webkit-text-size-adjust: 100%;
  overflow-x: hidden;
}

body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
               "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  font-size: var(--fs-body);
  line-height: var(--lh);
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

button, input, textarea, select { font-family: inherit; font-size: var(--fs-body); color: inherit; }
button { cursor: pointer; border: none; background: none; }
a { color: var(--accent); }

.wrap {
  max-width: 680px;
  margin: 0 auto;
  padding: 14px 14px 0;
}

/* ---------- 顶部 ---------- */
.topbar {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: saturate(150%) blur(10px);
  -webkit-backdrop-filter: saturate(150%) blur(10px);
  border-bottom: 1px solid var(--line);
  padding-top: env(safe-area-inset-top);
}
@supports not (background: color-mix(in srgb, red 50%, blue)) {
  .topbar { background: var(--bg); }
}
.topbar-inner {
  max-width: 680px; margin: 0 auto;
  padding: 10px 14px 8px;
  display: flex; align-items: center; gap: 10px;
}
.brand { display: flex; flex-direction: column; min-width: 0; }
.brand h1 {
  margin: 0; font-size: var(--fs-title); font-weight: 700; letter-spacing: .2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.brand .sub { font-size: var(--fs-xs); color: var(--muted); }
.topbar .spacer { flex: 1; }

.icon-btn {
  width: var(--tap); height: var(--tap);
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 12px; color: var(--muted);
}
.icon-btn:active { background: var(--surface-2); }

/* ---------- 视图 ---------- */
.view { display: none; padding-bottom: calc(var(--tabbar-h) + 34px + env(safe-area-inset-bottom)); }
.view.active { display: block; animation: fadeUp .22s ease both; }
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}

/* ---------- 卡片 ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 16px;
  margin: 0 0 14px;
}
.card.tight { padding: 13px 14px; }
.card-head {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 10px;
}
.card-head h2 {
  margin: 0; font-size: var(--fs-h2); font-weight: 650;
}
.card-head .count { font-size: var(--fs-sm); color: var(--muted); font-weight: 400; }
.card-head .grow { flex: 1; }

.chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 9px; border-radius: 999px;
  font-size: var(--fs-xs); line-height: 1.6;
  background: var(--accent-soft); color: var(--accent-strong);
  border: 1px solid var(--accent-line);
  white-space: nowrap;
}
.chip.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip.danger { background: var(--danger-soft); color: var(--danger); border-color: transparent; }
.chip.plain { background: var(--surface-2); color: var(--muted); border-color: transparent; }

.k-title { font-size: 19px; font-weight: 700; line-height: 1.45; margin: 8px 0 4px; }
.k-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 2px; }

.field { padding: 11px 0; border-top: 1px dashed var(--line); }
.field:first-of-type { border-top: none; }
.field .label {
  font-size: var(--fs-xs); color: var(--muted);
  letter-spacing: .4px; margin-bottom: 3px;
}
.field .value { font-size: var(--fs-body); word-break: break-word; overflow-wrap: anywhere; }
.field .value.mono { font-variant-numeric: tabular-nums; }

.task-list { margin: 4px 0 0; padding: 0; list-style: none; counter-reset: t; }
.task-list li {
  position: relative; padding: 5px 0 5px 26px; font-size: var(--fs-body);
  counter-increment: t;
}
.task-list li::before {
  content: counter(t); position: absolute; left: 0; top: 5px;
  width: 18px; height: 18px; border-radius: 50%;
  background: var(--accent-soft); color: var(--accent-strong);
  font-size: 11px; line-height: 18px; text-align: center; font-weight: 600;
}

/* ---------- 勾选项 ---------- */
.check-row {
  display: flex; align-items: flex-start; gap: 11px;
  min-height: var(--tap); padding: 8px 0;
  border-top: 1px dashed var(--line);
}
.check-row:first-of-type { border-top: none; }
.check-row .box {
  flex: 0 0 auto; width: 24px; height: 24px; margin-top: 2px;
  border: 1.8px solid var(--line); border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  color: transparent; transition: all .18s ease;
  background: var(--surface);
}
.check-row .box svg { width: 15px; height: 15px; }
.check-row.done .box { background: var(--accent); border-color: var(--accent); color: #fff; }
.check-row .body { flex: 1; min-width: 0; }
.check-row .t1 { font-size: var(--fs-body); transition: color .18s ease; }
.check-row.done .t1 { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
.check-row .t2 { font-size: var(--fs-xs); color: var(--muted); margin-top: 2px; word-break: break-word; }

/* ---------- 按钮 ---------- */
.btn {
  min-height: var(--tap); padding: 0 18px;
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  border-radius: 12px; font-size: var(--fs-body); font-weight: 600;
  background: var(--surface-2); color: var(--text);
  transition: transform .12s ease, background .18s ease, opacity .18s ease;
  border: 1px solid transparent;
}
.btn:active { transform: scale(.975); }
.btn.primary { background: var(--accent); color: #fff; box-shadow: var(--shadow); }
.btn.primary:active { background: var(--accent-strong); }
.btn.ghost { background: transparent; border-color: var(--line); color: var(--text); }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn-row > .btn { flex: 1 1 0; }

/* ---------- 日期切换 ---------- */
.datebar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.datebar .day { flex: 1; text-align: center; min-width: 0; }
.datebar .day .d1 { font-size: var(--fs-body); font-weight: 650; }
.datebar .day .d2 { font-size: var(--fs-xs); color: var(--muted); }
.datebar input[type="date"] {
  width: 100%; min-height: var(--tap);
  padding: 8px 10px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface);
  text-align: center;
}

/* ---------- 答题 ---------- */
.quiz-progress {
  height: 6px; border-radius: 999px; background: var(--surface-2);
  overflow: hidden; margin: 2px 0 12px;
}
.quiz-progress > i {
  display: block; height: 100%; width: 0;
  background: var(--accent); border-radius: 999px;
  transition: width .25s ease;
}
.quiz-stats { display: flex; gap: 8px; flex-wrap: wrap; font-size: var(--fs-sm); color: var(--muted); }
.quiz-stats b { color: var(--text); font-variant-numeric: tabular-nums; }

.flashcard {
  position: relative; background: var(--surface); border: 1px solid var(--line);
  border-radius: 20px; box-shadow: var(--shadow); padding: 20px 18px;
  min-height: 240px; display: flex; flex-direction: column; margin-bottom: 14px;
  animation: fadeUp .2s ease both;
}
.flashcard .fc-label { font-size: var(--fs-xs); color: var(--muted); letter-spacing: .5px; }
.flashcard .fc-front { font-size: 20px; font-weight: 650; line-height: 1.5; margin: 8px 0 0; word-break: break-word; }
.flashcard .fc-back {
  margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--line);
  font-size: var(--fs-body); line-height: 1.7; white-space: pre-wrap; word-break: break-word;
  animation: fadeUp .2s ease both;
}
.flashcard .fc-tip {
  margin-top: auto; padding-top: 16px; text-align: center;
  font-size: var(--fs-sm); color: var(--muted);
}
.flashcard .fc-chapter { margin-top: 10px; font-size: var(--fs-xs); color: var(--muted); }

.rate-row { display: flex; gap: 8px; margin-top: 4px; }
.rate-row .btn { flex: 1 1 0; padding: 0 8px; font-size: var(--fs-body); flex-direction: column; gap: 1px; min-height: 58px; }
.rate-row .btn small { font-size: var(--fs-xs); font-weight: 400; opacity: .78; }
.rate-row .btn.again { background: var(--danger-soft); color: var(--danger); }
.rate-row .btn.vague { background: var(--warn-soft); color: var(--warn); }
.rate-row .btn.good { background: var(--ok-soft); color: var(--ok); }
.rate-row .btn:active { transform: scale(.97); }

/* ---------- 表单 ---------- */
.form-row { margin-bottom: 12px; }
.form-row label { display: block; font-size: var(--fs-sm); color: var(--muted); margin-bottom: 6px; }
.input, textarea.input {
  width: 100%; min-height: var(--tap);
  padding: 11px 12px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--surface);
  font-size: var(--fs-body); line-height: 1.5;
  transition: border-color .18s ease, box-shadow .18s ease;
}
.input:focus, textarea.input:focus {
  outline: none; border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
textarea.input { min-height: 96px; resize: vertical; }
.hint { font-size: var(--fs-xs); color: var(--muted); margin-top: 6px; }

.notice {
  border-radius: 12px; padding: 11px 13px; font-size: var(--fs-sm);
  background: var(--warn-soft); color: var(--warn); margin-bottom: 12px;
  display: flex; gap: 8px; align-items: flex-start;
}
.notice.err { background: var(--danger-soft); color: var(--danger); }
.notice.ok { background: var(--ok-soft); color: var(--ok); }

/* ---------- 统计 ---------- */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.tile {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 13px 14px; box-shadow: var(--shadow);
}
.tile .k { font-size: var(--fs-xs); color: var(--muted); }
.tile .v { font-size: 24px; font-weight: 700; line-height: 1.25; font-variant-numeric: tabular-nums; }
.tile .v small { font-size: var(--fs-sm); font-weight: 500; color: var(--muted); margin-left: 2px; }

.rank { counter-reset: r; margin: 0; padding: 0; list-style: none; }
.rank li {
  counter-increment: r; position: relative;
  padding: 10px 0 10px 30px; border-top: 1px dashed var(--line);
  font-size: var(--fs-sm); word-break: break-word;
}
.rank li:first-child { border-top: none; }
.rank li::before {
  content: counter(r); position: absolute; left: 0; top: 11px;
  width: 20px; height: 20px; border-radius: 6px; text-align: center;
  font-size: 11px; line-height: 20px; font-weight: 700;
  background: var(--surface-2); color: var(--muted);
}
.rank li .n { font-size: var(--fs-xs); color: var(--danger); margin-left: 6px; }

.heat { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.heat .cell {
  aspect-ratio: 1 / 1; border-radius: 6px; background: var(--surface-2);
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; color: var(--muted);
}
.heat .cell.l1 { background: var(--accent-soft); color: var(--accent-strong); }
.heat .cell.l2 { background: var(--accent-line); color: var(--text); }
.heat .cell.l3 { background: var(--accent); color: #fff; }
.heat .cell.today { outline: 2px solid var(--accent); outline-offset: 1px; }
.heat-legend { display: flex; align-items: center; gap: 6px; font-size: var(--fs-xs); color: var(--muted); margin-top: 8px; }
.heat-legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

/* ---------- 底部标签栏 ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: saturate(160%) blur(12px);
  -webkit-backdrop-filter: saturate(160%) blur(12px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}
@supports not (background: color-mix(in srgb, red 50%, blue)) {
  .tabbar { background: var(--surface); }
}
.tabbar-inner {
  max-width: 680px; margin: 0 auto;
  display: grid; grid-template-columns: repeat(5, 1fr);
  height: var(--tabbar-h);
}
.tab {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  color: var(--muted); font-size: 11.5px; min-height: var(--tap);
  transition: color .18s ease;
}
.tab svg { width: 21px; height: 21px; }
.tab.active { color: var(--accent); }
.tab.active svg { stroke-width: 2.1; }


/* ---------- 学习材料 / 阅读层 ---------- */
.m-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.m-chips .chip { min-height: 34px; padding: 4px 13px; cursor: pointer; }
.m-chips .chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.m-item {
  display: block; background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 14px 15px; margin: 0 0 12px; cursor: pointer;
  transition: transform .12s ease, border-color .18s ease;
}
.m-item:active { transform: scale(.99); border-color: var(--accent-line); }
.m-item.read { background: var(--surface-2); }
.m-item .m-row { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin-bottom: 6px; }
.m-item .m-date { font-size: var(--fs-xs); color: var(--muted); font-variant-numeric: tabular-nums; }
.m-item .m-title { font-size: 17px; font-weight: 650; line-height: 1.45; margin-bottom: 4px; word-break: break-word; }
.m-item .m-sub { font-size: var(--fs-xs); color: var(--muted); line-height: 1.55; word-break: break-word; }
.m-item.read .m-title { color: var(--muted); }

.material-entry .me-top { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
.material-entry .me-badge { font-size: var(--fs-xs); color: var(--accent-strong); background: var(--accent-soft); border-radius: 999px; padding: 2px 9px; }
.material-entry .me-title { font-size: 18px; font-weight: 650; line-height: 1.45; margin: 0 0 5px; word-break: break-word; }
.material-entry .me-sub { font-size: var(--fs-sm); color: var(--muted); line-height: 1.6; margin: 0 0 12px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

.reader {
  position: fixed; inset: 0; z-index: 80; display: none;
  background: var(--bg); flex-direction: column;
}
.reader.show { display: flex; }
body.reader-open { overflow: hidden; }
.reader-head {
  flex: 0 0 auto; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-top: env(safe-area-inset-top);
}
.reader-head-inner { max-width: 680px; margin: 0 auto; padding: 9px 14px 11px; }
.r-h-row { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.r-h-title { font-size: 20px; font-weight: 700; line-height: 1.42; margin: 7px 0 3px; word-break: break-word; }
.r-h-sub { font-size: var(--fs-xs); color: var(--muted); line-height: 1.5; word-break: break-word; }
.reader-scroll { flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.reader-body { max-width: 680px; margin: 0 auto; padding: 15px 15px 26px; }
.reader-body p { font-size: 16px; line-height: 1.78; margin: 0; white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere; }
.reader-quote {
  background: var(--accent-soft); border-left: 4px solid var(--accent);
  border-radius: 0 12px 12px 0; padding: 12px 14px; margin-bottom: 17px;
}
.reader-quote .r-label { font-size: var(--fs-xs); color: var(--accent-strong); letter-spacing: .6px; margin-bottom: 5px; font-weight: 650; }
.reader-quote p { font-size: 16px; line-height: 1.75; }
.r-sec { margin: 0 0 19px; }
.r-sec > h3 {
  font-size: 17px; font-weight: 700; line-height: 1.4; margin: 0 0 8px;
  padding-bottom: 6px; border-bottom: 1px solid var(--line);
}
.r-sec > h3 .r-sec-sub { font-size: var(--fs-xs); color: var(--muted); font-weight: 400; margin-left: 6px; }
.r-sec > p + p { margin-top: 9px; }
.r-list { margin: 0; padding: 0 0 0 22px; }
.r-list li { font-size: 16px; line-height: 1.78; margin: 6px 0; word-break: break-word; }
.r-list.warn li::marker { color: var(--warn); }
.r-quiz { border: 1px solid var(--line); border-radius: 12px; margin: 0 0 10px; background: var(--surface); overflow: hidden; }
.r-quiz summary {
  list-style: none; cursor: pointer; min-height: var(--tap);
  padding: 11px 13px; display: flex; align-items: flex-start; gap: 9px;
  font-size: 16px; line-height: 1.6; font-weight: 600;
}
.r-quiz summary::-webkit-details-marker { display: none; }
.r-quiz summary .q-no { flex: 0 0 auto; color: var(--accent-strong); font-weight: 700; }
.r-quiz summary .q-text { flex: 1; min-width: 0; }
.r-quiz summary .q-tip { flex: 0 0 auto; font-size: var(--fs-xs); color: var(--accent); font-weight: 400; padding-top: 3px; }
.r-quiz[open] summary .q-tip { color: var(--muted); }
.r-ans {
  border-top: 1px dashed var(--line); padding: 11px 13px 13px;
  font-size: 16px; line-height: 1.78; color: var(--text); background: var(--surface-2);
  white-space: pre-wrap; word-break: break-word;
}
.r-ans b { display: block; font-size: var(--fs-xs); color: var(--ok); margin-bottom: 4px; letter-spacing: .5px; }
.r-src { margin: 0; padding: 0 0 0 20px; }
.r-src li { font-size: var(--fs-sm); line-height: 1.7; color: var(--muted); margin: 4px 0; word-break: break-word; }
.reader-foot {
  flex: 0 0 auto; background: var(--surface); border-top: 1px solid var(--line);
  padding: 9px 12px calc(9px + env(safe-area-inset-bottom));
}
.reader-foot-inner { max-width: 680px; margin: 0 auto; display: grid; gap: 8px; }
.rf-row { display: flex; gap: 8px; }
.rf-row > .btn { flex: 1 1 0; min-width: 0; padding: 0 10px; font-size: var(--fs-sm); }

/* ---------- 轻提示 ---------- */
.toast {
  position: fixed; left: 50%; bottom: calc(var(--tabbar-h) + 22px + env(safe-area-inset-bottom));
  transform: translate(-50%, 12px);
  background: rgba(20, 40, 46, .94); color: #fff;
  padding: 10px 16px; border-radius: 12px; font-size: var(--fs-sm);
  max-width: 84vw; text-align: center;
  opacity: 0; pointer-events: none; transition: all .22s ease; z-index: 60;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-color-scheme: dark) {
  .toast { background: rgba(228, 242, 244, .95); color: #10262c; }
}

.sheet {
  position: fixed; inset: 0; z-index: 70; display: none;
  background: rgba(8, 20, 24, .45);
  align-items: flex-end;
}
.sheet.show { display: flex; }
.sheet .panel {
  width: 100%; max-width: 680px; margin: 0 auto;
  background: var(--surface); border-radius: 20px 20px 0 0;
  padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
  max-height: 86vh; overflow: auto;
  animation: sheetUp .24s ease both;
}
@keyframes sheetUp { from { transform: translateY(60px); opacity: .6; } to { transform: none; opacity: 1; } }
.sheet h3 { margin: 0 0 10px; font-size: var(--fs-h2); }
.sheet textarea {
  width: 100%; min-height: 200px; font-family: ui-monospace, Menlo, Consolas, monospace;
  font-size: 12.5px; line-height: 1.5;
}

/* ---------- 空状态 ---------- */
.empty { text-align: center; color: var(--muted); font-size: var(--fs-sm); padding: 22px 6px; }
.empty .big { font-size: 30px; margin-bottom: 6px; opacity: .5; }

.section-title {
  font-size: var(--fs-xs); color: var(--muted); letter-spacing: .8px;
  margin: 4px 2px 8px;
}
.footer-note { text-align: center; color: var(--muted); font-size: var(--fs-xs); padding: 18px 8px 8px; }

@media (min-width: 700px) {
  .wrap { padding: 18px 18px 0; }
  .brand h1 { font-size: 24px; }
}

 细胞的基本功能 A必掌握","c":"第二章 第二节 细胞的生物电现象"},{"f":"请复述「神经-骨骼肌接头兴奋传递」的必掌握判别要点","b":"AP到达末梢、Ca2+内流、ACh囊泡释放、结合终板膜N2受体、终板电位、肌膜AP；ACh被胆碱酯酶水解；箭毒阻断受体、新斯的明抑制酶","t":"生理学 细胞的基本功能 A必掌握","c":"第二章 第三节 肌细胞的收缩功能"},{"f":"请复述「骨骼肌收缩的滑行学说与兴奋-收缩耦联」的必掌握判别要点","b":"细肌丝向M线滑行、肌节缩短，粗肌丝长度不变；耦联三环节：肌膜AP经T管传入、三联管处Ca2+释放、Ca2+与肌钙蛋白结合触发横桥周期；Ca2+是耦联因子","t":"生理学 细胞的基本功能 A必掌握","c":"第二章 第三节 肌细胞的收缩功能"},{"f":"请复述「肌肉收缩的力学表现」的必掌握判别要点","b":"等长收缩张力增而长度不变，等张收缩长度缩短而张力不变；前负荷决定初长度（异长自身调节），后负荷增大则缩短速度减慢、做功先增后减","t":"生理学 细胞的基本功能 B必掌握","c":"第二章 第三节 肌细胞的收缩功能"},{"f":"请复述「血液的组成与理化特性」的必掌握判别要点","b":"血浆蛋白：白蛋白维持胶体渗透压、球蛋白参与免疫与运输、纤维蛋白原参与凝血；血浆pH 7.35至7.45，渗透压约300mOsm/(kg·H2O)","t":"生理学 血液 B必掌握","c":"第三章 第一节 血液的组成和理化特性"},{"f":"请复述「血浆渗透压与红细胞的渗透脆性」的必掌握判别要点","b":"晶体渗透压占绝大部分、主要维持细胞内外水平衡；胶体渗透压由白蛋白形成、维持血管内外水平衡；低渗液致红细胞膨胀破裂，高渗致皱缩","t":"生理学 血液 A必掌握","c":"第三章 第一节 血液的组成和理化特性"},{"f":"请复述「红细胞生理与生成的调节」的必掌握判别要点","b":"成年男性(4.5至5.5)×10^12/L，寿命约120天，衰老在脾破坏；生成需铁、叶酸、维生素B12、蛋白质；缺氧经肾产生EPO促红系增殖分化","t":"生理学 血液 A必掌握","c":"第三章 第二节 血细胞生理"},{"f":"请复述「白细胞与血小板生理」的必掌握判别要点","b":"中性粒细胞占比最高、参与急性化脓性感染；血小板参与止血第一相（黏附、聚集、释放），正常(100至300)×10^9/L","t":"生理学 血液 B必掌握","c":"第三章 第二节 血细胞生理"},{"f":"请复述「生理性止血的基本过程」的必掌握判别要点","b":"血管收缩、血小板血栓形成（一期止血）、血液凝固（二期止血）；出血时间反映血小板与血管功能，凝血时间反映凝血因子","t":"生理学 血液 A必掌握","c":"第三章 第三节 生理性止血"},{"f":"请复述「血液凝固的机制与途径」的必掌握判别要点","b":"多数凝血因子为蛋白酶原、需维生素K参与（Ⅱ、Ⅶ、Ⅸ、Ⅹ）；内源由Ⅻ接触激活启动，外源由组织因子启动，二者在Ⅹ因子激活处汇合，共同通路为凝血酶原转凝血酶再形成纤维蛋白","t":"生理学 血液 A必掌握","c":"第三章 第三节 生理性止血"},{"f":"请复述「抗凝系统与纤维蛋白溶解」的必掌握判别要点","b":"抗凝血酶Ⅲ、蛋白质C系统、组织因子途径抑制物；纤溶：纤溶酶原经激活物转为纤溶酶，降解纤维蛋白；肝素增强抗凝血酶Ⅲ活性","t":"生理学 血液 B必掌握","c":"第三章 第三节 生理性止血"},{"f":"请复述「ABO血型系统」的必掌握判别要点","b":"A型红细胞含A抗原、血清含抗B；B型含B抗原、抗A；AB型含A和B抗原、无抗体；O型无抗原、含抗A抗B；天然抗体为IgM，不能通过胎盘","t":"生理学 血液 A必掌握","c":"第三章 第四节 血型和输血原则"},{"f":"请复述「Rh血型与输血原则」的必掌握判别要点","b":"Rh抗原以D抗原性最强；Rh阴性者第二次接受Rh阳性血可发生溶血；母Rh阴性、胎Rh阳性时IgG抗体通过胎盘致新生儿溶血；输血须同型且交叉配血","t":"生理学 血液 A必掌握","c":"第三章 第四节 血型和输血原则"},{"f":"请复述「心肌细胞的分类与电生理特性」的必掌握判别要点","b":"工作细胞（心房肌、心室肌）无自律性；自律细胞（窦房结、浦肯野）有4期自动去极；快反应细胞0期由Na+内流，慢反应细胞0期由Ca2+内流","t":"生理学 血液循环 B必掌握","c":"第四章 第一节 心脏的泵血功能"},{"f":"请复述「心室肌细胞动作电位各期机制」的必掌握判别要点","b":"0期Na+内流；1期K+外流；2期平台Ca2+内流与K+外流平衡，是AP时程长、不出现强直收缩的原因；3期K+外流；4期钠泵与Na+-Ca2+交换恢复","t":"生理学 血液循环 A必掌握","c":"第四章 第一节 心脏的泵血功能"},{"f":"请复述「窦房结细胞电位与心肌自律性」的必掌握判别要点","b":"窦房结P细胞4期由K+外流衰减、If钠内流、T型钙通道激活共同形成；最大复极电位绝对值小、阈电位约-40mV，故自律性最高，为正常起搏点","t":"生理学 血液循环 A必掌握","c":"第四章 第一节 心脏的泵血功能"},{"f":"请复述「心肌兴奋性、期前收缩与代偿间歇」的必掌握判别要点","b":"心肌有效不应期特别长（含平台期），故不发生强直收缩；有效不应期后给予额外刺激可产生期前收缩，其后窦性冲动落在不应期而出现代偿间歇","t":"生理学 血液循环 A必掌握","c":"第四章 第一节 心脏的泵血功能"},{"f":"请复述「心肌的传导性与收缩性特点」的必掌握判别要点","b":"房室结传导最慢（房室延搁，保证房先于室收缩）；浦肯野纤维最快；心肌收缩依赖细胞外Ca2+，呈全或无式同步收缩","t":"生理学 血液循环 B必掌握","c":"第四章 第一节 心脏的泵血功能"},{"f":"请复述「心动周期与心脏泵血过程」的必掌握判别要点","b":"等容收缩期室内压升高最快、两瓣均关闭；快速射血期室内压最高、主动脉压降至最低点；等容舒张期室内压下降最快；心房收缩贡献约25%充盈","t":"生理学 血液循环 A必掌握","c":"第四章 第一节 心脏的泵血功能"},{"f":"请复述「心输出量及其影响因素」的必掌握判别要点","b":"每搏量为舒张末期容积减收缩末期容积；心输出量为每搏量乘心率；前负荷（异长自身调节）、后负荷（动脉压）、收缩能力（等长调节）、心率过快时因充盈不足反而下降","t":"生理学 血液循环 A必掌握","c":"第四章 第一节 心脏的泵血功能"},{"f":"请复述「心音与心功能评价」的必掌握判别要点","b":"第一心音房室瓣关闭、标志心室收缩开始；第二心音半月瓣关闭；第三心音快速充盈期；第四心音心房收缩；射血分数正常不低于55%","t":"生理学 血液循环 B必掌握","c":"第四章 第一节 心脏的泵血功能"},{"f":"请复述「动脉血压与影响因素」的必掌握判别要点","b":"形成条件：循环系统充盈、心脏射血、外周阻力、大动脉弹性；影响因素：每搏量（收缩压为主）、心率、外周阻力（舒张压为主）、大动脉弹性、循环血量与血管容量比","t":"生理学 血液循环 A必掌握","c":"第四章 第二节 血管生理"},{"f":"请复述「微循环与组织液生成」的必掌握判别要点","b":"微循环通路：迂回通路（物质交换）、直捷通路（回流）、动静脉短路（体温调节）；有效滤过压等于毛细血管压加组织液胶体渗透压，减去血浆胶体渗透压与组织液静水压","t":"生理学 血液循环 A必掌握","c":"第四章 第二节 血管生理"},{"f":"请复述「静脉血压与静脉回流」的必掌握判别要点","b":"中心静脉压反映心脏射血能力与血容量；影响因素：体循环平均充盈压、心脏收缩力、体位改变、骨骼肌泵、呼吸泵","t":"生理学 血液循环 B必掌握","c":"第四章 第二节 血管生理"},{"f":"请复述「心血管活动的神经调节」的必掌握判别要点","b":"颈动脉窦与主动脉弓压力感受器、舌咽与迷走神经、延髓孤束核、心迷走与心交感及缩血管中枢；血压升高时反射性心率减慢、血管舒张，属负反馈，对波动性血压缓冲最强","t":"生理学 血液循环 A必掌握","c":"第四章 第三节 心血管活动的调节"},{"f":"请复述「心血管活动的体液调节」的必掌握判别要点","b":"肾上腺素对α、β受体均强，心输出量增加、总外周阻力变化不大；去甲肾上腺素主要激动α受体，升压明显、反射性心率减慢；血管紧张素Ⅱ收缩血管并促醛固酮分泌","t":"生理学 血液循环 A必掌握","c":"第四章 第三节 心血管活动的调节"},{"f":"请复述「冠脉循环与脑循环特点」的必掌握判别要点","b":"冠脉血流主要在舒张期、受心肌代谢产物（腺苷）调节；脑循环存在血脑屏障与自身调节，对缺氧和CO2敏感","t":"生理学 血液循环 B必掌握","c":"第四章 第四节 器官循环"},{"f":"请复述「呼吸过程与肺通气原理」的必掌握判别要点","b":"肺通气动力是呼吸肌收缩引起的肺内压与大气压差；平静吸气主动、呼气被动；胸膜腔内压为负压（-5至-10cmH2O），维持肺扩张与静脉回流","t":"生理学 呼吸 A必掌握","c":"第五章 第一节 肺通气"},{"f":"请复述「肺容积与肺容量」的必掌握判别要点","b":"肺活量为潮气量加补吸气量加补呼气量；功能残气量为残气量加补呼气量；残气量不能呼出，阻塞性通气障碍时残气量与肺总量比值升高","t":"生理学 呼吸 A必掌握","c":"第五章 第一节 肺通气"},{"f":"请复述「肺通气功能的评价」的必掌握判别要点","b":"肺泡通气量为潮气量减无效腔气量再乘呼吸频率；浅快呼吸使肺泡通气量显著下降；深慢呼吸可提高肺泡通气效率","t":"生理学 呼吸 A必掌握","c":"第五章 第一节 肺通气"},{"f":"请复述「气体交换与影响因素」的必掌握判别要点","b":"换气动力是分压差；VA/Q正常约0.84，比值增大相当无效腔增大，减小相当功能性分流；肺纤维化使弥散距离增大","t":"生理学 呼吸 A必掌握","c":"第五章 第二节 肺换气和组织换气"},{"f":"请复述「氧的运输与氧解离曲线」的必掌握判别要点","b":"Hb与O2结合呈S形曲线；P50正常约26.5mmHg；右移（pH下降、PCO2升高、温度升高、2,3-DPG增多）利于释氧，左移如低温与库存血时释氧减少","t":"生理学 呼吸 A必掌握","c":"第五章 第三节 气体在血液中的运输"},{"f":"请复述「二氧化碳的运输」的必掌握判别要点","b":"物理溶解约5%、氨基甲酰血红蛋白约7%、HCO3-约88%；碳酸酐酶在红细胞内催化CO2水化；霍尔丹效应指Hb氧合促进CO2释放","t":"生理学 呼吸 A必掌握","c":"第五章 第三节 气体在血液中的运输"},{"f":"请复述「呼吸中枢与呼吸节律的形成」的必掌握判别要点","b":"基本呼吸中枢在延髓；呼吸调整中枢在脑桥；节律起源于延髓前包钦格复合体的起步细胞；大脑皮层可随意控制呼吸","t":"生理学 呼吸 A必掌握","c":"第五章 第四节 呼吸运动的调节"},{"f":"请复述「化学感受性呼吸反射」的必掌握判别要点","b":"中枢化学感受器对H+敏感、对缺氧不敏感；外周颈动脉体与主动脉体对缺氧敏感；CO2是维持呼吸最重要的生理性刺激；缺氧兴奋呼吸的作用弱于CO2","t":"生理学 呼吸 A必掌握","c":"第五章 第四节 呼吸运动的调节"},{"f":"请复述「肺牵张反射与其他呼吸反射」的必掌握判别要点","b":"肺扩张引起吸气抑制（黑伯反射），肺缩小引起吸气兴奋；咳嗽、喷嚏为防御性反射；J感受器参与肺水肿时的呼吸急促","t":"生理学 呼吸 B必掌握","c":"第五章 第四节 呼吸运动的调节"},{"f":"请复述「消化道平滑肌的生理特性」的必掌握判别要点","b":"静息电位不稳定、有基本电节律（慢波）；对机械牵张、温度、化学刺激敏感，对电刺激不敏感","t":"生理学 消化和吸收 B必掌握","c":"第六章 第一节 消化生理概述"},{"f":"请复述「消化系统的神经支配」的必掌握判别要点","b":"内在神经丛（黏膜下与肌间神经丛）构成肠神经系统，可独立完成局部反射；副交感（迷走）促进运动与分泌，交感抑制","t":"生理学 消化和吸收 A必掌握","c":"第六章 第一节 消化生理概述"},{"f":"请复述「胃肠激素」的必掌握判别要点","b":"促胃液素（G细胞）促胃酸分泌与黏膜生长；促胰液素（S细胞）促胰液的水和HCO3-；缩胆囊素（I细胞）促胆囊收缩与胰酶分泌；抑胃肽促胰岛素释放","t":"生理学 消化和吸收 A必掌握","c":"第六章 第一节 消化生理概述"},{"f":"请复述「唾液分泌与咀嚼吞咽」的必掌握判别要点","b":"唾液为低渗液，含唾液淀粉酶、溶菌酶；纯神经反射性调节，副交感促进；吞咽分口腔期（随意）、咽期、食管期","t":"生理学 消化和吸收 B必掌握","c":"第六章 第二节 口腔内消化"},{"f":"请复述「胃液分泌与胃黏膜屏障」的必掌握判别要点","b":"壁细胞H+-K+-ATP酶泌酸，组胺、促胃液素、ACh促分泌，前列腺素与质子泵抑制剂抑制；内因子促维生素B12吸收；头期约30%、胃期约60%、肠期约10%","t":"生理学 消化和吸收 A必掌握","c":"第六章 第三节 胃内消化"},{"f":"请复述「胃的运动与胃排空」的必掌握判别要点","b":"容受性舒张由迷走迷走反射介导；排空速度糖快于蛋白质快于脂肪，受十二指肠反馈（肠胃反射、抑胃肽）抑制；液体排空快","t":"生理学 消化和吸收 A必掌握","c":"第六章 第三节 胃内消化"},{"f":"请复述「胰液的分泌与调节」的必掌握判别要点","b":"胰液含胰淀粉酶、胰脂肪酶、胰蛋白酶原等，是最重要的消化液；促胰液素促水和HCO3-分泌，缩胆囊素促胰酶分泌；胰蛋白酶原由肠激酶激活","t":"生理学 消化和吸收 A必掌握","c":"第六章 第四节 小肠内消化"},{"f":"请复述「胆汁的分泌与胆盐的肠肝循环」的必掌握判别要点","b":"胆汁不含消化酶；胆盐乳化脂肪、形成混合微胶粒、促进脂溶性维生素吸收；95%胆盐在回肠末端重吸收经门静脉回肝","t":"生理学 消化和吸收 A必掌握","c":"第六章 第四节 小肠内消化"},{"f":"请复述「小肠的运动与吸收」的必掌握判别要点","b":"分节运动使食糜与消化液充分混合、增加接触面积；铁在十二指肠、钙在小肠上段、维生素B12在回肠末端、胆盐与脂肪酸在回肠吸收","t":"生理学 消化和吸收 A必掌握","c":"第六章 第四节 小肠内消化"},{"f":"请复述「能量代谢与测定原理」的必掌握判别要点","b":"能量代谢测定基于能量守恒；间接测热法测耗氧量与CO2产量，呼吸商等于CO2产量除以耗氧量；糖呼吸商1.0、脂肪0.71、蛋白质0.80、混合膳食约0.85","t":"生理学 能量代谢与体温 B必掌握","c":"第七章 第一节 能量代谢"},{"f":"请复述「影响能量代谢的因素」的必掌握判别要点","b":"肌肉活动影响最显著；食物特殊动力效应以蛋白质最强（约30%）；环境温度在20至30℃时代谢最稳定","t":"生理学 能量代谢与体温 A必掌握","c":"第七章 第一节 能量代谢"},{"f":"请复述「基础代谢与基础代谢率」的必掌握判别要点","b":"基础状态为清醒、静卧、空腹12小时以上、室温20至25℃；BMR实测值与正常平均值相差超过15%有病理意义；甲亢升高、甲减降低","t":"生理学 能量代谢与体温 A必掌握","c":"第七章 第一节 能量代谢"},{"f":"请复述「体温与体温的正常变动」的必掌握判别要点","b":"体核温度以直肠最高、腋窝最低；清晨2至6时最低、午后最高，波动不超过1℃；女性排卵后体温升高0.3至0.5℃","t":"生理学 能量代谢与体温 A必掌握","c":"第七章 第二节 体温"},{"f":"请复述「机体的产热与散热」的必掌握判别要点","b":"战栗产热来自骨骼肌节律性收缩；非战栗产热来自棕色脂肪组织解偶联；散热方式：辐射、传导、对流、蒸发，环境温度高于皮肤温度时蒸发是唯一途径","t":"生理学 能量代谢与体温 A必掌握","c":"第七章 第二节 体温"},{"f":"请复述「体温调节与调定点学说」的必掌握判别要点","b":"温度敏感神经元在下丘脑视前区-下丘脑前部；调定点由PO/AH设定，发热是调定点上移（致热原使PGE2升高），中暑是调定点未变而散热失效，两者机制不同","t":"生理学 能量代谢与体温 A必掌握","c":"第七章 第二节 体温"},{"f":"请复述「肾血流量的自身调节」的必掌握判别要点","b":"动脉压在80至180mmHg范围内肾血流量保持相对恒定；机制为入球小动脉肌源性收缩与致密斑管球反馈；超出范围则随血压变化","t":"生理学 尿的生成和排出 A必掌握","c":"第八章 第一节 肾的功能解剖和肾血流量"},{"f":"请复述「肾小球滤过与滤过分数」的必掌握判别要点","b":"滤过膜由内皮细胞、基膜、足细胞裂孔膜构成；有效滤过压为肾小球毛细血管压减血浆胶体渗透压减囊内压；滤过分数约19%，正常滤过率125ml/min","t":"生理学 尿的生成和排出 A必掌握","c":"第八章 第二节 肾小球的滤过功能"},{"f":"请复述「影响肾小球滤过的因素」的必掌握判别要点","b":"肾小球毛细血管压升高滤过增加；血浆胶体渗透压升高（大量输血浆代用品）滤过减少；囊内压升高（结石、肿瘤）滤过减少；滤过膜面积减小或通透性增大分别致少尿与蛋白尿","t":"生理学 尿的生成和排出 A必掌握","c":"第八章 第二节 肾小球的滤过功能"},{"f":"请复述「近端小管的重吸收」的必掌握判别要点","b":"近端小管重吸收约65%至70%的Na+与水，葡萄糖、氨基酸全部重吸收；葡萄糖重吸收有极限，肾糖阈约180mg/dl；为等渗性重吸收","t":"生理学 尿的生成和排出 A必掌握","c":"第八章 第三节 肾小管和集合管的物质转运功能"},{"f":"请复述「髓袢与逆流倍增机制」的必掌握判别要点","b":"降支细段对水通透、对NaCl不通透；升支粗段主动重吸收NaCl而对水不通透，形成髓质渗透梯度；直小血管以逆流交换维持梯度","t":"生理学 尿的生成和排出 A必掌握","c":"第八章 第三节 肾小管和集合管的物质转运功能"},{"f":"请复述「远曲小管与集合管的重吸收与分泌」的必掌握判别要点","b":"远曲小管与集合管重吸收约10%Na+，受醛固酮调节；Na+重吸收增多促进K+分泌（钠钾交换），K+与H+分泌存在竞争；H+分泌与HCO3-重吸收耦联","t":"生理学 尿的生成和排出 A必掌握","c":"第八章 第三节 肾小管和集合管的物质转运功能"},{"f":"请复述「尿液的浓缩与稀释」的必掌握判别要点","b":"ADH促进集合管对水通透，水在髓质高渗区被重吸收形成浓缩尿；缺乏ADH时排出稀释尿；髓袢结构是形成梯度的基础","t":"生理学 尿的生成和排出 A必掌握","c":"第八章 第四节 尿的生成和排出"},{"f":"请复述「抗利尿激素与醛固酮的调节」的必掌握判别要点","b":"ADH由下丘脑视上核与室旁核合成、神经垂体释放，刺激为血浆晶体渗透压升高与血容量减少，作用为集合管水重吸收；醛固酮由球状带分泌，刺激为肾素-血管紧张素Ⅱ、血K+升高，作用为远曲小管保钠排钾","t":"生理学 尿的生成和排出 A必掌握","c":"第八章 第四节 尿的生成和排出"},{"f":"请复述「排尿反射与膀胱功能」的必掌握判别要点","b":"膀胱充盈牵张感受器、盆神经传入、骶髓初级排尿中枢、副交感传出使逼尿肌收缩与内括约肌舒张；高位中枢可抑制；骶髓损伤后出现尿失禁","t":"生理学 尿的生成和排出 A必掌握","c":"第八章 第四节 尿的生成和排出"},{"f":"请复述「感受器的一般生理特性」的必掌握判别要点","b":"每种感受器有适宜刺激；换能即把刺激能量转为感受器电位；适应有快慢之分，痛觉感受器几乎不适应","t":"生理学 感觉器官 B必掌握","c":"第九章 第一节 感受器的一般生理特性"},{"f":"请复述「眼的折光系统与视近调节」的必掌握判别要点","b":"近视用凹透镜、远视用凸透镜、散光用柱镜；视近时晶状体变凸（调节）、瞳孔缩小、双眼会聚；老视由晶状体弹性下降致调节力减弱","t":"生理学 感觉器官 A必掌握","c":"第九章 第二节 视觉"},{"f":"请复述「眼的感光换能与视觉二元学说」的必掌握判别要点","b":"视杆细胞含视紫红质、感弱光无色觉、暗适应依赖视紫红质合成；视锥细胞感强光与色觉；视紫红质由视蛋白与11-顺视黄醛构成，缺乏维生素A致夜盲","t":"生理学 感觉器官 A必掌握","c":"第九章 第二节 视觉"},{"f":"请复述「视力、视野与色觉」的必掌握判别要点","b":"视力为分辨两点最小距离的能力，用视角表示；视野颞侧较大、上侧较小；色觉三原色学说以红绿蓝三种视锥为基础","t":"生理学 感觉器官 A必掌握","c":"第九章 第二节 视觉"},{"f":"请复述「耳的听觉功能」的必掌握判别要点","b":"中耳增压减振，咽鼓管平衡压力；感音换能部位在耳蜗基底膜螺旋器；高频声波在蜗底、低频在蜗顶共振；耳蜗微音器电位无阈值、无不应期、可跟随声波频率","t":"生理学 感觉器官 A必掌握","c":"第九章 第三节 听觉"},{"f":"请复述「前庭器官与平衡觉」的必掌握判别要点","b":"半规管感受旋转变速运动，壶腹嵴为感受装置；椭圆囊与球囊感受直线变速与头位变化，囊斑耳石为感受装置；前庭反应含姿势调节、自主神经反应与眼震颤","t":"生理学 感觉器官 B必掌握","c":"第九章 第四节 前庭器官的功能"},{"f":"请复述「神经元与突触传递」的必掌握判别要点","b":"突触前膜去极、Ca2+内流、递质释放、与受体结合产生突触后电位；特征：单向传递、突触延搁、总和、对内外环境敏感、易疲劳","t":"生理学 神经系统 A必掌握","c":"第十章 第一节 神经系统功能活动的基本原理"},{"f":"请复述「神经递质与受体」的必掌握判别要点","b":"递质须具备合成、储存、释放、受体与失活五条件；乙酰胆碱、去甲肾上腺素、多巴胺、5-羟色胺、谷氨酸（兴奋性）、GABA与甘氨酸（抑制性）；受体分离子通道型与G蛋白耦联型","t":"生理学 神经系统 A必掌握","c":"第十章 第一节 神经系统功能活动的基本原理"},{"f":"请复述「突触后电位与突触前抑制」的必掌握判别要点","b":"EPSP由Na+内流为主引起去极；IPSP由Cl-内流为主引起超极；突触前抑制通过轴突-轴突突触使末梢递质释放减少，潜伏期长、持续时间久","t":"生理学 神经系统 A必掌握","c":"第十章 第一节 神经系统功能活动的基本原理"},{"f":"请复述「反射与中枢整合」的必掌握判别要点","b":"反射弧含感受器、传入神经、中枢、传出神经、效应器；中枢整合形式：辐散、聚合、反馈环路、链锁状联系；反射时与中枢突触数目相关","t":"生理学 神经系统 B必掌握","c":"第十章 第一节 神经系统功能活动的基本原理"},{"f":"请复述「感觉投射系统」的必掌握判别要点","b":"特异性投射经三级神经元、点对点投射至皮层特定区，引起特定感觉并激发皮层发放；非特异性投射经脑干网状结构弥散投射至皮层广泛区，维持觉醒","t":"生理学 神经系统 A必掌握","c":"第十章 第二节 神经系统的感觉分析功能"},{"f":"请复述「牵涉痛」的必掌握判别要点","b":"内脏痛觉传入与体表传入在脊髓同一后角神经元汇聚（会聚学说）；心肌缺血牵涉至心前区与左臂内侧、胆囊炎牵涉至右肩胛、阑尾炎牵涉至脐周","t":"生理学 神经系统 A必掌握","c":"第十章 第二节 神经系统的感觉分析功能"},{"f":"请复述「脊髓反射与肌牵张反射」的必掌握判别要点","b":"腱反射为快速牵拉引起的单突触反射（膝跳反射）；肌紧张为缓慢持续牵拉引起的多突触反射，是维持姿势的基础；反射弧受损则腱反射消失、肌张力降低","t":"生理学 神经系统 A必掌握","c":"第十章 第三节 神经系统对躯体运动的调节"},{"f":"请复述「脑干对肌紧张的调节与去大脑僵直」的必掌握判别要点","b":"在中脑上、下丘之间切断脑干，伸肌紧张亢进呈角弓反张；机制为易化区活动相对占优势，属γ僵直与α僵直；说明脑干对肌紧张的双重调节","t":"生理学 神经系统 A必掌握","c":"第十章 第三节 神经系统对躯体运动的调节"},{"f":"请复述「基底神经节与小脑的功能」的必掌握判别要点","b":"帕金森病为黑质多巴胺能神经元受损、纹状体ACh活动相对亢进，表现为肌紧张增高与静止性震颤；舞蹈病为纹状体GABA能神经元受损，表现为肌张力降低与不自主运动","t":"生理学 神经系统 A必掌握","c":"第十章 第三节 神经系统对躯体运动的调节"},{"f":"请复述「自主神经系统的功能与递质」的必掌握判别要点","b":"交感兴奋时心率加快、血压升高、瞳孔扩大、消化抑制；副交感相反；阿托品阻断M受体、酚妥拉明阻断α受体、普萘洛尔阻断β受体","t":"生理学 神经系统 A必掌握","c":"第十章 第四节 神经系统对内脏活动的调节"},{"f":"请复述「下丘脑的内脏调节功能」的必掌握判别要点","b":"视前区调节体温；视上核与室旁核调节水平衡；外侧区摄食中枢、腹内侧区饱中枢；与情绪和内分泌轴相关","t":"生理学 神经系统 B必掌握","c":"第十章 第四节 神经系统对内脏活动的调节"},{"f":"请复述「脑电活动与睡眠」的必掌握判别要点","b":"清醒安静闭眼时α波、睁眼时β波、睡眠时θ与δ波；慢波睡眠促生长与体力恢复，异相睡眠（REM）与记忆巩固和做梦相关","t":"生理学 神经系统 A必掌握","c":"第十章 第五节 脑的高级功能"},{"f":"请复述「学习与记忆」的必掌握判别要点","b":"记忆分短时与长时，短时与环路活动有关、长时与突触结构改变及蛋白质合成有关；突触可塑性包括长时程增强（LTP）与长时程抑制（LTD），海马是关键结构","t":"生理学 神经系统 B必掌握","c":"第十章 第五节 脑的高级功能"},{"f":"请复述「激素的分类与作用机制」的必掌握判别要点","b":"含氮激素多为水溶性、作用于膜受体经第二信使（cAMP、IP3/DG、Ca2+）；类固醇激素为脂溶性、进入细胞与核受体结合调节基因转录，起效慢而持久","t":"生理学 内分泌 A必掌握","c":"第十一章 第一节 内分泌与激素"},{"f":"请复述「下丘脑-垂体轴的调节」的必掌握判别要点","b":"下丘脑释放激素经垂体门脉至腺垂体；腺垂体分泌TSH、ACTH、FSH、LH、GH、PRL；靶腺激素负反馈于下丘脑与垂体；神经垂体释放ADH与催产素","t":"生理学 内分泌 A必掌握","c":"第十一章 第二节 下丘脑-垂体内分泌"},{"f":"请复述「生长激素」的必掌握判别要点","b":"GH促生长（经IGF-1）与促代谢（升血糖、促脂解）；睡眠慢波期分泌达高峰；幼年缺乏致侏儒症、过多致巨人症；成年过多致肢端肥大症","t":"生理学 内分泌 A必掌握","c":"第十一章 第二节 下丘脑-垂体内分泌"},{"f":"请复述「甲状腺激素的生理作用」的必掌握判别要点","b":"提高基础代谢率与产热；促进脑与骨骼发育（胎儿期缺乏致呆小症）；提高β受体对儿茶酚胺的敏感性，故甲亢见心动过速、脉压增大","t":"生理学 内分泌 A必掌握","c":"第十一章 第三节 甲状腺内分泌"},{"f":"请复述「甲状腺功能的调节」的必掌握判别要点","b":"TRH促TSH、TSH促T3/T4合成释放；T3/T4负反馈抑制TRH与TSH；缺碘时T3/T4减少致TSH升高与甲状腺肿；大剂量碘抑制甲状腺激素释放（Wolff-Chaikoff效应）","t":"生理学 内分泌 A必掌握","c":"第十一章 第三节 甲状腺内分泌"},{"f":"请复述「肾上腺皮质激素」的必掌握判别要点","b":"球状带醛固酮（保钠排钾）、束状带皮质醇（升血糖、抗炎、抗免疫）、网状带性激素；ACTH主要促皮质醇；皮质醇对 CRH 与 ACTH 呈负反馈","t":"生理学 内分泌 A必掌握","c":"第十一章 第四节 肾上腺内分泌"},{"f":"请复述「胰岛素与胰高血糖素」的必掌握判别要点","b":"胰岛素由B细胞分泌，促糖摄取利用与糖原合成、抑糖异生，是唯一降血糖激素；胰高血糖素由A细胞分泌，促糖原分解与糖异生；血糖浓度是最重要的调节因素","t":"生理学 内分泌 A必掌握","c":"第十一章 第五节 胰岛内分泌"},{"f":"请复述「甲状旁腺激素与钙磷代谢」的必掌握判别要点","b":"PTH升血钙降血磷（促骨吸收、促肾小管重吸收钙、促1,25-(OH)2-D3生成）；降钙素降血钙降血磷；维生素D促肠钙吸收与骨钙化","t":"生理学 内分泌 A必掌握","c":"第十一章 第六节 甲状旁腺内分泌"},{"f":"请复述「男性生殖功能」的必掌握判别要点","b":"睾酮由间质细胞分泌，维持生精、促男性化与合成代谢；FSH作用于支持细胞促生精，LH促睾酮分泌；睾酮负反馈抑制GnRH与LH","t":"生理学 生殖 B必掌握","c":"第十二章 第一节 男性生殖"},{"f":"请复述「卵巢周期与激素」的必掌握判别要点","b":"卵泡期雌激素逐渐升高，排卵前达高峰并正反馈触发LH峰；黄体期孕激素与雌激素均升高；雌激素对LH呈低浓度抑制、高浓度正反馈的双相作用","t":"生理学 生殖 A必掌握","c":"第十二章 第二节 女性生殖"},{"f":"请复述「月经周期」的必掌握判别要点","b":"月经期因黄体萎缩、雌孕激素骤降致内膜脱落出血；增生期受雌激素作用内膜增厚；分泌期受孕激素作用腺体分泌、为着床准备；周期约28天","t":"生理学 生殖 A必掌握","c":"第十二章 第二节 女性生殖"},{"f":"请复述「妊娠与分娩的内分泌调节」的必掌握判别要点","b":"受精后滋养层分泌hCG维持黄体、8至10周达峰；hPL促乳腺发育与胎儿生长；分娩启动与子宫肌兴奋性升高、缩宫素与前列腺素、胎膜与宫颈成熟相关；哺乳期吸吮抑制GnRH致闭经","t":"生理学 生殖 A必掌握","c":"第十二章 第二节 女性生殖"}]};

window.__NKMATERIALS__ = [{"id":"P01","date":"2026-10-21","module":"绪论","prio":"B","title":"生理学的研究对象与研究方法","chapter":"第一章 第一节 生理学的研究内容和方法","pos":"这一节不考细节，但决定了你后面所有推导的尺度：同一个现象在整体、器官、细胞三个层面看到的规律并不相同。","body":[{"h":"一、生理学研究什么","t":"生理学研究机体生命活动的现象、规律、机制及其对内外环境变化的反应，最终服务于「功能如何实现」这一问题。它与解剖学（结构）、生物化学（分子过程）互为支撑：解剖给形态，生化给分子，生理给功能整合。判断一道题是否属于生理学，看它问的是「结构长什么样」还是「功能怎么实现、为什么这样实现」。"},{"h":"二、三个研究层次","t":"整体水平：研究完整机体在环境变化下的整合反应，如运动时血压、呼吸、体温的协同调节。器官系统水平：研究某一器官或系统的功能及其影响因素，如心脏泵血、肾脏泌尿。细胞分子水平：研究细胞膜转运、离子通道、信号转导等基本机制。三层不是并列的学科分支，而是同一功能在不同尺度上的解释：细胞机制解释器官表现，器官表现解释整体反应。答题时先判断题目落在哪一层，再选对应语言作答，避免用整体现象去解释细胞机制。"},{"h":"三、研究方法：急性与慢性","t":"急性动物实验又分在体与离体：在体实验保留神经体液联系，可观察完整调节；离体实验排除整体干扰，便于研究单一组织或细胞的直接机制，但失去神经体液调控。慢性动物实验在清醒、接近自然状态下长期观察，最能反映整体功能，但周期长、条件控制难。三者取舍的核心是：你要保留调节回路，还是要排除干扰。"},{"h":"四、学习方法提示","t":"生理学的记忆量集中在「数值区间、离子流向、调节通路」三类信息上，其余多为可推导的因果链。建议读每一节时先立一条主线：刺激 → 感受器 → 传入 → 中枢整合 → 传出 → 效应器 → 反馈，把具体知识点挂到这条链上，遗忘时按链找回。"}],"keys":["生理学研究功能实现机制，与解剖（结构）、生化（分子）互为支撑","三层次：整体水平、器官系统水平、细胞分子水平，是同一功能的不同尺度","急性实验含在体（保留调节）与离体（排除干扰）；慢性实验观察清醒整体状态"],"traps":["把三个研究层次当成互相独立的学科分支，是常见概念题错误","离体实验结论不能直接外推到整体，因为丢失了神经体液调节"],"quiz":[{"q":"离体蛙心灌流实验观察到心率随灌流液钙浓度变化，能否据此推断整体动物血钙升高时心率必然同向变化？","a":"不能。离体实验排除了神经与体液调节，整体动物中血钙变化会同时触发压力感受性反射、交感与迷走张力改变等代偿，最终表现可能被掩盖或反转。答题时应先说明实验层次的局限，再讨论整体推断。"}],"src":["人卫版《生理学》第9版 第一章；Ganong 生理学复习纲要（研究方法部分）"]},{"id":"P02","date":"2026-10-22","module":"绪论","prio":"A","title":"内环境与稳态","chapter":"第一章 第二节 机体的内环境","pos":"稳态不是「不变」，而是「在波动中被拉回」。把这句话真正理解，后面血压、血糖、体温、酸碱的调节就都是它的应用题。","body":[{"h":"一、内环境的概念","t":"内环境指细胞外液，包括血浆、组织液、淋巴液与脑脊液等，是细胞直接生活的液体环境。它与外环境（外界空气、饮食内容）之间隔着皮肤、黏膜、消化道壁等屏障，因此外环境的剧烈变化并不直接传导给细胞。"},{"h":"二、稳态的定义与实质","t":"稳态指内环境的理化性质（温度、pH、渗透压、离子浓度、血糖、血压等）在微小范围内波动的动态平衡状态。关键词有三个：一是「动态」，说明各项指标时刻在小幅变化；二是「平衡」，说明存在把偏离纠回的机制；三是「范围」，说明判定标准是区间而非点值。把稳态理解成数值恒定不变，是最常见的概念性失分。"},{"h":"三、维持机制","t":"稳态靠负反馈调节维持，涉及神经、体液、自身调节三条途径。以血糖为例：进食后血糖升高 → 胰岛B细胞分泌胰岛素增加 → 促进组织摄取利用葡萄糖、肝糖原合成 → 血糖回落；血糖过低时胰高血糖素与肾上腺素升高 → 糖原分解与糖异生增加 → 血糖回升。整条通路就是「偏离—检测—纠正」的闭环。"},{"h":"四、稳态破坏的临床意义","t":"疾病在很大程度上就是稳态维持能力被突破。失血时先靠压力感受性反射与RAAS维持血压，代偿失败才出现休克；糖尿病是血糖调节环路失效；尿毒症是内环境代谢产物清除障碍。理解稳态，等于拿到一条把病理生理串起来的主线。"}],"keys":["内环境＝细胞外液（血浆、组织液、淋巴、脑脊液）","稳态＝理化性质在微小波动中的动态平衡，判定靠区间不靠点值","维持机制以负反馈为核心，涉及神经、体液、自身调节"],"traps":["把稳态等同于恒定不变，忽略「波动」这一必要成分","把细胞内液当作内环境，实际内环境只指细胞外液"],"quiz":[{"q":"剧烈运动时体温升至38.5℃，出汗后回落至37℃，这一过程是否说明稳态被破坏？","a":"不说明。稳态允许指标在有限范围内波动，关键在于是否存在有效的纠偏机制。本例中体温升高触发散热增加并回落，正是稳态调节在工作；若持续升高且散热机制失效（如中暑），才是稳态被突破。"}],"src":["人卫版《生理学》第9版 第一章第二节；《病理生理学》第9版 水电解质与酸碱平衡章节"]},{"id":"P03","date":"2026-10-23","module":"绪论","prio":"A","title":"生理功能的调节方式：神经、体液与自身调节","chapter":"第一章 第三节 机体生理功能的调节","pos":"三条调节途径的价值不在记忆定义，而在「给一个现象，能判断它走的是哪条路」。这也是病例分析与机制题的通用起手式。","body":[{"h":"一、神经调节","t":"通过反射弧完成，路径为感受器 → 传入神经 → 神经中枢 → 传出神经 → 效应器。特点是迅速、准确、短暂、定位清楚，在多数快速反应中占主导地位，如压力感受性反射、腱反射、瞳孔对光反射。判断要点：有没有明确的反射弧、反应是否在毫秒到秒级完成。"},{"h":"二、体液调节","t":"通过血液或组织液中的化学物质（激素、代谢产物、细胞因子）作用于靶细胞。特点是缓慢、广泛、持久，如甲状腺激素对代谢的长期调节、醛固酮对水盐的调节、CO2对呼吸的刺激。注意局部性体液调节（如组织代谢产物扩张局部血管）虽不经血液循环远距离运输，仍归入体液调节范畴。"},{"h":"三、自身调节","t":"不依赖神经与体液，由组织器官自身对刺激的直接反应完成。典型例子：心肌异长自身调节（前负荷增加使初长度增加、收缩力增强）、肾血流自身调节（动脉压在80至180mmHg内波动时肾血流量相对恒定）、脑血管的肌源性调节。判断要点：切断神经、阻断激素后现象依然存在。"},{"h":"四、三者的协同与分层","t":"真实生理过程通常三条途径叠加，且有先后顺序。以血压下降为例：数秒内压力感受性反射启动（神经调节），数分钟至数小时RAAS与ADH介入（体液调节），长期则靠肾脏调节血容量与血管重塑。考试中若问「最主要的调节方式」，要按时间尺度作答，而不是笼统答神经调节。"}],"keys":["神经调节：快、准、短，经反射弧，占主导","体液调节：慢、广、久，经激素与代谢产物","自身调节：不依赖神经体液，如心肌异长自身调节、肾血流自身调节"],"traps":["把局部代谢产物扩张血管排除在体液调节之外，属于分类错误","问「最主要」时忽略时间尺度，一律答神经调节"],"quiz":[{"q":"离体肾灌注实验中，灌注压从100mmHg升至150mmHg，肾血流量几乎不变。这属于哪种调节？","a":"自身调节（肌源性机制为主，兼有管球反馈）。实验已排除神经与全身体液因素，血流量在80至180mmHg区间内保持相对恒定，正是肾血流自身调节的定义性表现。"}],"src":["人卫版《生理学》第9版 第一章第三节"]},{"id":"P04","date":"2026-10-24","module":"绪论","prio":"A","title":"反馈控制与前馈：负反馈、正反馈与前馈","chapter":"第一章 第三节 体内的控制系统","pos":"控制论语言是生理学的通用语法。负反馈维持稳态，正反馈制造「一旦启动就不可逆」的过程，前馈则是「预判式」调节。","body":[{"h":"一、负反馈","t":"输出信息反过来抑制或减弱控制部分的活动，使输出朝相反方向变化，从而把指标稳定在调定点附近。生理意义是维持稳态，是机体最普遍、最重要的调节形式。典型例：压力感受性反射（血压升高 → 抑制心交感、兴奋心迷走 → 血压回落）、体温调节、血糖调节、甲状腺激素对TRH与TSH的负反馈。"},{"h":"二、正反馈","t":"输出信息反过来增强控制部分的活动，使过程不断加速，直至完成。生理意义是使某一过程「一次性走到底」，本身不维持稳态。典型例：分娩时宫缩刺激宫颈 → 缩宫素释放增加 → 宫缩更强；排尿反射中膀胱收缩 → 牵张 → 收缩更强；凝血过程中凝血酶激活更多凝血酶原；动作电位去极相Na+内流。"},{"h":"三、前馈","t":"干扰信号在尚未引起输出偏差之前，就通过预判性通路提前启动调节，使偏差不至于发生。典型例：见到食物、闻到气味时胃液与唾液提前分泌；运动开始前心率与呼吸先升高。前馈比负反馈「更快一步」，但预判错误时会造成调节过量。"},{"h":"四、三类控制方式的判别","t":"看三点：方向（输出是削弱还是增强控制活动）、目的（维持稳定还是推动过程完成）、时序（偏差后纠正还是偏差前预防）。做题时最常见的是把正反馈误判为「不好的调节」——正反馈本身中性，关键在于该过程是否需要迅速终结。"}],"keys":["负反馈：削弱控制活动，维持稳态，最普遍","正反馈：增强控制活动，推动过程完成，如分娩、排尿、凝血、AP去极相","前馈：偏差发生前预判性启动，如进食前胃液分泌"],"traps":["把正反馈等同于病理状态；实际上分娩、凝血、排尿均为正常生理性正反馈","把「见到食物流口水」归为负反馈，实为前馈"],"quiz":[{"q":"大量失血后血压下降，压力感受性反射使心率加快、外周血管收缩。这一调节属于哪类控制，其局限是什么？","a":"属负反馈（血压下降被部分纠回）。局限在于：感受器对持续性低血压会发生适应，且当血压低于感受器阈值（约50至60mmHg）时反射失效，此时需靠RAAS、ADH与肾脏调节血容量，代偿失败即进入失代偿性休克。"}],"src":["人卫版《生理学》第9版 第一章第三节；《病理生理学》第9版 休克章节"]},{"id":"P05","date":"2026-10-25","module":"细胞","prio":"B","title":"细胞膜的结构与跨膜转运总览","chapter":"第二章 第一节 细胞膜的结构和物质转运功能","pos":"所有跨膜转运题的解题第一步都是同一件事：先判断物质性质（脂溶性、分子大小、带电与否），再判断是否需要膜蛋白和能量。","body":[{"h":"一、膜的分子结构","t":"细胞膜以脂质双层为骨架，镶嵌或附着蛋白质，外表面连有糖链形成糖萼。脂质双层疏水核心构成通透屏障：脂溶性小分子可自由穿行，水溶性物质与带电离子则必须借助膜蛋白。膜的流动性受胆固醇与脂肪酸饱和度影响，温度降低时流动性下降（这与冷藏保存红细胞、血小板时膜损伤相关）。"},{"h":"二、跨膜转运的四类","t":"被动转运（不耗能，顺浓度梯度）：单纯扩散与易化扩散（经载体、经通道）。主动转运（耗能，逆浓度梯度）：原发性（直接耗ATP，如钠泵、钙泵、质子泵）与继发性（借其他物质的浓度梯度供能，如Na+-葡萄糖同向转运）。膜泡运输：出胞与入胞，转运大分子与颗粒，需耗能并有囊泡融合。"},{"h":"三、判断流程","t":"第一步看是否为气体或脂溶性小分子（O2、CO2、N2、乙醇、类固醇激素）→ 单纯扩散。第二步看是否为水或离子→ 经通道。第三步看是否为葡萄糖、氨基酸等有机小分子→ 需载体；若为顺梯度则易化扩散，逆梯度则继发性主动转运（肠、肾小管上皮）。第四步看是否为蛋白质、多糖、细菌等大分子→ 出胞或入胞。"},{"h":"四、临床衔接","t":"洋地黄抑制钠泵，使细胞内Na+升高、经Na+-Ca2+交换使细胞内Ca2+升高而增强心肌收缩力；质子泵抑制剂阻断胃壁细胞H+-K+-ATP酶而抑酸；甘露醇经渗透作用脱水。这些药物的机制都直接建立在转运分类之上。"}],"keys":["脂质双层为屏障，疏水核心决定「脂溶性可穿、水溶性需蛋白」","四类：被动（单纯扩散、易化扩散）、主动（原发、继发）、膜泡运输","判断顺序：物质性质 → 是否需蛋白 → 是否耗能"],"traps":["把水的转运一律当作单纯扩散；水主要经水通道（aquaporin）转运","把继发性主动转运误判为不耗能，实际间接消耗钠泵建立的梯度"],"quiz":[{"q":"肠上皮细胞从肠腔吸收葡萄糖属于哪种转运方式，为什么不是易化扩散？","a":"继发性主动转运（Na+-葡萄糖同向转运，SGLT）。虽然葡萄糖本身顺浓度梯度进入细胞，但驱动力来自钠泵维持的Na+跨膜梯度，属于间接耗能，故不是易化扩散；其基侧膜面的GLUT2则为易化扩散。"}],"src":["人卫版《生理学》第9版 第二章第一节；《药理学》第9版 强心苷与质子泵抑制剂章节"]},{"id":"P06","date":"2026-10-27","module":"细胞","prio":"A","title":"单纯扩散与易化扩散","chapter":"第二章 第一节 细胞膜的结构和物质转运功能","pos":"三者最容易混的是「谁饱和、谁有竞争性抑制、谁受膜电位影响」。把这三问背成条件反射，选择题几乎不会再错。","body":[{"h":"一、单纯扩散","t":"物质以分子运动方式直接穿过脂质双层，顺浓度梯度，不耗能、不需膜蛋白。速率取决于膜两侧浓度差与膜对该物质的通透性，无饱和现象。典型物质：O2、CO2、N2、乙醇、尿素、类固醇激素、部分麻醉药。判断要点：无饱和、无竞争、不受膜蛋白阻断剂影响。"},{"h":"二、经载体易化扩散","t":"水溶性小分子在载体蛋白帮助下顺浓度梯度转运，如葡萄糖进入红细胞（GLUT1）、氨基酸进入细胞。三大特征：结构特异性（载体只认特定构型）、饱和现象（载体数量有限，浓度升高到一定程度速率不再增加）、竞争性抑制（结构类似物竞争同一载体）。此外还受温度与膜脂质成分影响。"},{"h":"三、经通道易化扩散","t":"带电离子经离子通道顺电化学梯度跨膜，如Na+、K+、Ca2+通道。特点：转运速率极快（每秒可过10^7至10^8个离子）、有离子选择性、受门控调节（电压门控、配体门控、机械门控）。通道有开放与关闭两种构象，处于开放状态时才导通。与载体相比，通道无饱和现象，但可被特异性阻断剂阻断（如河豚毒素阻断电压门控钠通道、四乙铵阻断钾通道）。"},{"h":"四、三者的对比框架","t":"把五个维度列成一张表：是否需膜蛋白、是否耗能、是否饱和、是否有竞争性抑制、是否受膜电位影响。单纯扩散：不需要、不耗能、不饱和、无竞争、不受膜电位影响；载体介导：需要、不耗能、饱和、有竞争；通道介导：需要、不耗能、不饱和、可有特异性阻断、受膜电位影响。考试中出现「饱和」二字，几乎可以锁定载体。"}],"keys":["单纯扩散：不需蛋白、不耗能、不饱和，O2/CO2/乙醇/类固醇","载体介导：有特异性、饱和、竞争性抑制，如GLUT1转运葡萄糖","通道介导：极快、有选择性、门控，可被特异性阻断剂阻断"],"traps":["把离子通道介导的转运说成「有饱和现象」，属概念混淆","把尿素列为需要载体的物质，实际尿素可经脂质双层单纯扩散"],"quiz":[{"q":"给红细胞悬液加入葡萄糖结构类似物后，葡萄糖摄取速率下降；再加入足量葡萄糖后下降幅度减小。这提示什么机制？","a":"提示经载体易化扩散的竞争性抑制。类似物与葡萄糖竞争同一载体结合位点，故速率下降；提高葡萄糖浓度后竞争力增强，抑制被部分克服，这一表现与单纯扩散、通道介导均不符。"}],"src":["人卫版《生理学》第9版 第二章第一节"]},{"id":"P07","date":"2026-10-28","module":"细胞","prio":"A","title":"原发性主动转运：钠泵及其生理意义","chapter":"第二章 第一节 细胞膜的结构和物质转运功能","pos":"钠泵是整本生理学的「地基」：没有它，静息电位、动作电位、继发性主动转运、细胞体积调节全部塌掉。","body":[{"h":"一、化学本质与转运比例","t":"钠泵即Na+-K+-ATP酶，由α与β两个亚基组成，位于细胞膜上。每分解1分子ATP，将3个Na+移出细胞、2个K+移入细胞，属逆浓度梯度的原发性主动转运。由于每次循环净移出1个正电荷，故称生电性钠泵，对静息电位有少量贡献（约数毫伏）。"},{"h":"二、生理意义","t":"第一，维持细胞内高K+、细胞外高Na+的跨膜浓度梯度，这是静息电位与动作电位产生的物质基础。第二，为继发性主动转运提供动力，如肠与肾小管上皮的Na+-葡萄糖同向转运、Na+-Ca2+交换。第三，调节细胞体积：细胞外液低渗时细胞肿胀，钠泵激活将Na+泵出并伴随水外移，防止细胞破裂。第四，维持细胞内pH，通过Na+-H+交换参与酸碱调节。第五，为营养物质吸收提供驱动力。"},{"h":"三、能量代谢与调节","t":"钠泵耗能占静息代谢率的相当比例（神经组织可达20%至40%），因此缺氧、低温、代谢抑制时钠泵活性下降，细胞内Na+蓄积、细胞肿胀。甲状腺激素、胰岛素、醛固酮可上调钠泵活性；哇巴因（ouabain）与洋地黄类为其特异性抑制剂。"},{"h":"四、临床联系","t":"洋地黄抑制心肌细胞钠泵 → 细胞内Na+升高 → Na+-Ca2+交换增强 → 细胞内Ca2+升高 → 心肌收缩力增强（正性肌力）；同时因Na+蓄积使静息电位绝对值减小、膜电位接近阈电位，易诱发心律失常，这是洋地黄中毒的电生理基础。缺血再灌注时钠泵功能恢复延迟，是细胞水肿与钙超载的重要环节。"}],"keys":["Na+-K+-ATP酶，1个ATP泵出3个Na+、泵入2个K+，净移出1个正电荷","维持离子梯度、供能继发转运、调节细胞体积、参与pH调节","洋地黄与哇巴因抑制钠泵；缺氧低温使钠泵活性下降"],"traps":["记成「泵入3个Na+、泵出2个K+」，方向与比例同时错","认为钠泵对静息电位无贡献，忽略其生电性作用"],"quiz":[{"q":"洋地黄增强心肌收缩力与诱发心律失常，为何是同一机制的两个结果？","a":"均源于抑制钠泵。收缩力增强：细胞内Na+升高→Na+-Ca2+交换增强→细胞内Ca2+升高→收缩力增强。心律失常：Na+蓄积使静息电位绝对值减小、接近阈电位，兴奋性升高、传导减慢，易形成折返与触发活动。因此治疗窗窄，需监测血钾与心电图。"}],"src":["人卫版《生理学》第9版 第二章第一节；《药理学》第9版 强心苷章节"]},{"id":"P08","date":"2026-10-29","module":"细胞","prio":"B","title":"继发性主动转运与膜泡运输","chapter":"第二章 第一节 细胞膜的结构和物质转运功能","pos":"判断继发性主动转运的关键一问：这个物质自己逆梯度，动力是不是来自另一个物质的顺梯度？若答案是「是」，即属此类。","body":[{"h":"一、继发性主动转运","t":"不直接消耗ATP，而是利用钠泵建立的Na+跨膜浓度梯度供能，属间接耗能。分同向转运（symport，如Na+-葡萄糖、Na+-氨基酸在小肠与肾小管上皮刷状缘）与反向转运（antiport，如Na+-H+交换、Na+-Ca2+交换）。判断要点：转运本身不水解ATP，但去除钠泵梯度后转运立即停止。"},{"h":"二、常见实例与抑制剂","t":"肠道与肾小管葡萄糖吸收用SGLT（钠依赖葡萄糖转运体），基侧膜面再以GLUT2易化扩散出细胞；甲状腺滤泡细胞摄碘经钠碘同向转运体（NIS），是甲状腺显像与放射性碘治疗的基础；肾小管Na+-H+交换参与HCO3-重吸收。根皮苷抑制SGLT，可解释肾性糖尿；强心苷间接抑制Na+-Ca2+交换。"},{"h":"三、膜泡运输：出胞与入胞","t":"出胞：胞内囊泡移至膜下、与膜融合、把内容物排出，如神经递质释放、激素分泌、消化酶分泌，需Ca2+内流触发。入胞：膜内陷包裹外物形成囊泡，分吞噬（颗粒，如中性粒细胞吞噬细菌）与吞饮（液体）；受体介导入胞使大分子高效摄取，如LDL经LDL受体入胞，该通路障碍致家族性高胆固醇血症。"},{"h":"四、与其他转运方式的鉴别","t":"原发性主动转运：直接水解ATP，如钠泵、钙泵、质子泵。继发性主动转运：不直接水解ATP，借Na+梯度。易化扩散：顺梯度、不耗能。三者常被放在一道题中比较，判断只看两点：方向上是否逆梯度、能量上是否直接耗ATP。"}],"keys":["继发主动转运借Na+梯度供能，分同向（SGLT）与反向（Na+-H+、Na+-Ca2+）","出胞需Ca2+触发，如递质与激素释放；入胞含吞噬、吞饮、受体介导","LDL受体介导入胞障碍致家族性高胆固醇血症"],"traps":["把Na+-Ca2+交换说成原发性主动转运，其能量来自Na+梯度，属继发性","认为继发性主动转运完全不耗能，忽略其对钠泵的间接依赖"],"quiz":[{"q":"抑制钠泵后，小肠上皮对葡萄糖的吸收为何迅速下降？","a":"因SGLT的驱动力是Na+跨膜梯度，该梯度由钠泵维持。钠泵被抑制后细胞内Na+蓄积、梯度消失，同向转运失去动力，葡萄糖吸收随之下降，这正说明其属继发性主动转运而非易化扩散。"}],"src":["人卫版《生理学》第9版 第二章第一节；《生物化学与分子生物学》第9版 脂蛋白代谢章节"]},{"id":"P09","date":"2026-10-30","module":"细胞的基本功能","prio":"A","title":"静息电位及其产生机制","chapter":"第二章 第二节 细胞的生物电现象","pos":"静息电位（RP）是后面所有电活动讨论的起点：动作电位的幅度、阈电位的关系、兴奋性的高低，全都要减去这个基线。","body":[{"h":"一、定义与数值","t":"静息电位是细胞未受刺激时存在于膜两侧的电位差，规定膜外为 0，膜内为负值。骨骼肌约 -90 mV，神经细胞约 -70 mV，平滑肌约 -55 mV。所有可兴奋细胞的 RP 都是内负外正，这一极性由膜两侧离子分布与膜的选择通透性共同决定。"},{"h":"二、形成机制","t":"细胞内 K+ 浓度约为细胞外的 30 倍，安静时膜对 K+ 通透性最高（钾漏通道），K+ 顺浓度梯度外流并把正电荷带走，使膜内变负；外流的 K+ 在膜外堆积形成电场，排斥后续 K+ 外流。当浓度梯度驱动力与电场阻力相等时达到 K+ 电-化学平衡，膜电位趋近 K+ 平衡电位（EK）。可用 Nernst 公式计算 EK≈59.5·lg([K+]o/[K+]i) mV（37℃）。实际 RP 绝对值略小于 EK，因为膜对 Na+ 有少量通透（Na+ 内流使膜去极化），并且生电性钠泵每次泵出 3 个 Na+、泵入 2 个 K+，净移出正电荷，使膜内更负。"},{"h":"三、影响因素","t":"细胞外 K+ 浓度升高 → 浓度梯度减小 → EK 绝对值减小 → RP 绝对值减小（去极化），这是高钾血症心肌兴奋性异常的离子基础。细胞外 K+ 降低时 RP 绝对值理论上增大，但实际因低钾抑制钠泵而可能出现反常去极化。钠泵被哇巴因抑制或代谢障碍（缺氧）时，生电性作用消失、离子梯度耗散，RP 绝对值减小。细胞外 Na+ 浓度对 RP 影响很小，因安静时钠通透性低。"},{"h":"四、与临床的连接","t":"高钾血症时 RP 绝对值减小，膜部分去极化使快钠通道处于失活状态，兴奋性反而下降，严重时心脏停搏；这一「先兴奋后抑制」的规律是判断高钾心电图改变（T 波高尖→P 波消失→QRS 增宽）的关键。"}],"keys":["RP 是 K+ 外流达电-化学平衡形成，数值接近 EK","RP 绝对值略小于 EK：少量 Na+ 内流 + 生电性钠泵","细胞外 K+ 升高 → RP 绝对值减小（去极化）"],"traps":["把 RP 说成「K+ 完全静止的平衡」，忽略其动态性与 Na+ 漏流","认为 RP 等于 EK 的精确值，答题时未提及 Na+ 内流与钠泵贡献"],"quiz":[{"q":"给离体神经纤维灌流液换成高钾溶液，静息电位与兴奋性如何变化？","a":"RP 绝对值减小（去极化）。轻度升高时距阈电位更近、兴奋性升高；继续升高则快钠通道大量失活，兴奋性下降甚至消失。答题要写「先升后降」并说明通道失活机制。"}],"src":["人卫版《生理学》第9版 第二章第二节；Ganong 生理学（膜电位章节）"]},{"id":"P10","date":"2026-10-31","module":"细胞的基本功能","prio":"A","title":"动作电位的波形与离子机制","chapter":"第二章 第二节 细胞的生物电现象","pos":"动作电位（AP）是「全或无」的，幅度由离子平衡电位与通道状态锁定，不随刺激强度改变——这是理解兴奋、传导、不应期的总钥匙。","body":[{"h":"一、波形分期","t":"典型 AP 分：①锋电位——去极相（膜内由 -70 mV 迅速上升到 +30 mV 左右）与复极相（迅速回落）；②超射——去极相中膜内电位由零变为正值的部分，幅度接近 Na+ 平衡电位；③后电位——负后电位（复极末端缓慢去极化小波）与正后电位（超极化）。整个锋电位约 1-2 ms，是「全或无」的主体。"},{"h":"二、离子机制","t":"去极相：达到阈电位后电压门控 Na+ 通道大量开放，Na+ 内流形成正反馈（再生性去极化），膜电位趋向 ENa（约 +60 mV）。复极相：Na+ 通道迅速失活关闭，电压门控 K+ 通道延迟开放，K+ 外流使膜复极。后电位：K+ 外流过多形成短暂超极化（正后电位），钠泵加速转运逐步恢复离子梯度（负后电位期）。AP 结束后钠泵活动增强，把内流的 Na+ 泵出、外流的 K+ 泵回。"},{"h":"三、三个基本特性","t":"①全或无：刺激达到阈值即产生固定幅度的 AP，不随刺激强度增加而增大；②不衰减传导：AP 在传导过程中幅度不减小；③脉冲式：不能融合，因存在不应期。这三点与局部电位形成对照，是选择题高频对照点。"},{"h":"四、影响因素","t":"细胞外 Na+ 浓度降低 → ENa 减小 → 超射幅度减小、AP 幅度降低；细胞外 K+ 升高 → RP 绝对值减小 → 与阈电位距离改变，同时 K+ 通道驱动力下降使复极延缓；局麻药（普鲁卡因、利多卡因）阻断 Na+ 通道，使 AP 幅度降低直至消失。"}],"keys":["去极相由 Na+ 内流正反馈形成，超射幅度接近 ENa","复极相由 Na+ 通道失活 + K+ 外流完成，钠泵恢复离子梯度","AP 三大特性：全或无、不衰减传导、脉冲式（有不应期）"],"traps":["把超射幅度直接等同于 ENa 的精确值，忽略通道失活与膜电容","认为复极相是钠泵主动泵出 Na+ 造成的，实际主要是 K+ 外流"],"quiz":[{"q":"为什么动作电位幅度不随刺激强度增大而增大？","a":"因为达到阈电位后 Na+ 通道全开放，膜电位趋向 ENa，幅度由离子浓度梯度与通道状态决定，与刺激强度无关；更强刺激只能增加刺激频率（多由不应期决定），不改变单次 AP 幅度。"}],"src":["人卫版《生理学》第9版 第二章第二节；Ganong 生理学（动作电位章节）"]},{"id":"P11","date":"2026-11-02","module":"细胞的基本功能","prio":"A","title":"动作电位的传导与局部电位","chapter":"第二章 第二节 细胞的生物电现象","pos":"同一根神经纤维上，AP 靠局部电流不断「重新点火」向前走；而局部电位只能原地衰减扩散——两者不可混用。","body":[{"h":"一、传导机制","t":"已兴奋区膜内为正、未兴奋区膜内为负，两者之间形成局部电流，使邻近未兴奋段去极化到阈电位，从而触发新的 AP。所以传导的本质是「局部电流引起邻近膜再生性去极化」，AP 在每个位点都是新产生的，故幅度不衰减。"},{"h":"二、两种传导方式","t":"无髓纤维为连续传导，逐点产生 AP，速度慢；有髓纤维髓鞘绝缘，只在郎飞结处有可兴奋膜，局部电流在结间跳跃，称跳跃式传导，速度快且节能。传导速度与纤维直径正相关、与髓鞘完整性正相关、与温度正相关（温度过低显著减慢）。B 类纤维轻度髓鞘化，C 类无髓鞘，速度最慢。"},{"h":"三、局部电位的特点","t":"局部电位（如终板电位、感受器电位、突触后电位）由局部离子通道开放引起，特点：①等级性——幅度随刺激强度增减；②衰减性——随距离指数衰减；③可总和——时间总和与空间总和；④无不应期，可叠加。局部电位是「电信号的前体」，达到阈电位才转化为 AP。"},{"h":"四、对照记忆","t":"AP：全或无、不衰减、有不应期、可沿膜传导远距离；局部电位：等级性、衰减、可总和、无不应期、只在局部。临床联系：局麻药阻断 Na+ 通道，使局部电流无法引起再生性去极化，传导被阻断而意识清醒。"}],"keys":["传导本质：局部电流使邻近膜达阈电位，逐点再生新 AP","有髓纤维跳跃式传导（郎飞结），速度快、耗能少","局部电位等级性、衰减、可总和、无不应期"],"traps":["把局部电位的总和特征误加到 AP 上，说 AP 可以叠加","认为有髓纤维传导快是因为髓鞘导电性好，实际是结间跳跃与电容减小"],"quiz":[{"q":"为什么有髓纤维的 AP 传导速度远快于同等直径的无髓纤维？","a":"髓鞘绝缘使局部电流在结间几乎无漏失，且只在郎飞结处产生 AP（跳跃式传导）；同时髓鞘降低膜电容、增加结间电阻，使更长的膜段在更短时间内达到阈电位。"}],"src":["人卫版《生理学》第9版 第二章第二节；Ganong 生理学（神经传导章节）"]},{"id":"P12","date":"2026-11-03","module":"细胞的基本功能","prio":"A","title":"阈电位、阈刺激与兴奋性","chapter":"第二章 第二节 细胞的生物电现象","pos":"兴奋性的高低，本质上是「RP 与阈电位之间的距离」；而兴奋之后，这段距离会被不应期暂时拉长。","body":[{"h":"一、阈电位","t":"阈电位是能引起 Na+ 通道大量开放、触发再生性去极化的临界膜电位（神经细胞约 -55 mV）。它比 RP 高（更接近零），两者差值越小，越容易兴奋。阈电位水平上移（绝对值增大）→ 差距变大 → 兴奋性降低；阈电位下移（绝对值减小）→ 兴奋性升高。"},{"h":"二、阈刺激与强度-时间曲线","t":"能使组织兴奋的最小刺激强度称阈强度（阈值），它是衡量兴奋性的指标，与兴奋性呈反变关系。刺激强度与作用时间存在依赖：强度-时间曲线呈双曲线，曲线上的点均可致兴奋；基强度是刺激时间足够长时的最小强度，时值是 2 倍基强度所需的最短时间，用于比较不同组织的兴奋性。"},{"h":"三、兴奋后兴奋性的变化","t":"AP 期间及之后依次为：①绝对不应期——Na+ 通道处于失活状态，任何强度刺激都不能兴奋，对应锋电位；②相对不应期——部分通道恢复，需阈上刺激；③超常期——膜轻度超极化，距阈电位更近，阈下刺激即可兴奋；④低常期——膜轻度去极化后通道部分失活，兴奋性低于正常。绝对不应期决定了 AP 不能融合、最高放电频率有限。"},{"h":"四、临床应用","t":"高钾血症初期因 RP 绝对值减小、距阈电位更近而兴奋性升高；重度高钾时 Na+ 通道大量失活，进入「抑制」阶段。局部麻醉药通过降低 Na+ 通道可用性，等效于提高阈值，使阈刺激不再引起 AP。"}],"keys":["阈电位与 RP 的差值决定兴奋性，差值小则兴奋性高","阈强度与兴奋性呈反变关系；时值用于比较不同组织兴奋性","兴奋后依次：绝对不应期→相对不应期→超常期→低常期"],"traps":["把「阈电位升高」理解成兴奋性升高（阈电位数值越正，越难兴奋）","认为绝对不应期内强刺激也能引起 AP"],"quiz":[{"q":"绝对不应期为什么任何强度的刺激都不能引起动作电位？","a":"此时电压门控 Na+ 通道处于失活状态，无论刺激多强都无法使其重新开放，再生性去极化无法启动；直到膜复极到一定水平、通道从失活态恢复，才可能再次兴奋。"}],"src":["人卫版《生理学》第9版 第二章第二节；Ganong 生理学（兴奋性章节）"]},{"id":"P13","date":"2026-11-04","module":"细胞的基本功能","prio":"A","title":"神经-骨骼肌接头兴奋传递","chapter":"第二章 第三节 肌细胞的收缩功能","pos":"这是「电-化学-电」转换的样板过程，毒物、药物、疾病几乎都在这一段的某一步上做文章。","body":[{"h":"一、结构基础","t":"接头由接头前膜（轴突末梢膨大，内含 ACh 囊泡、电压门控 Ca2+ 通道）、接头间隙（约 50 nm）与接头后膜（终板膜，有 N2 型 ACh 受体与乙酰胆碱酯酶）组成。终板膜有皱褶以扩大面积，其 ACh 受体是阳离子通道，开放后主要允许 Na+ 内流。"},{"h":"二、传递三步","t":"①电→化学：神经末梢 AP 使电压门控 Ca2+ 通道开放，Ca2+ 内流触发囊泡与前膜融合，以量子方式释放 ACh；②化学→电：ACh 扩散过间隙与终板膜 N2 受体结合，通道开放，Na+ 内流（少量 K+ 外流）产生终板电位（EPP）；③EPP 是局部电位，等级性、可总和、无不应期，当邻近肌膜去极化达阈电位时触发肌细胞 AP。ACh 迅速被乙酰胆碱酯酶水解为胆碱与乙酸，保证一次神经冲动只引起一次肌肉收缩。"},{"h":"三、影响传递的因素","t":"①Ca2+ 内流是触发环节：细胞外 Ca2+ 降低或 Mg2+ 升高（竞争性）使 ACh 释放减少，出现传递阻滞（高镁血症肌无力）；②筒箭毒碱、α-银环蛇毒阻断 N2 受体，产生松弛性肌麻痹；③琥珀胆碱使终板膜持续去极化，先兴奋后麻痹；④新斯的明、有机磷抑制胆碱酯酶，ACh 蓄积，引起肌束颤动甚至呼吸肌麻痹（有机磷中毒）；⑤肉毒杆菌毒素抑制 ACh 释放，导致弛缓性麻痹。"},{"h":"四、与临床的联系","t":"重症肌无力是 N2 受体抗体介导的受体减少，表现为重复活动后加重的肌无力，新斯的明可暂时改善；肌松药分为去极化型（琥珀胆碱）与非去极化型（筒箭毒碱），前者不能用新斯的明拮抗，后者可以——这是麻醉科常考点。"}],"keys":["传递三步：Ca2+ 内流触发 ACh 量子释放 → 终板电位 → 肌膜 AP","EPP 是局部电位：等级性、可总和、无不应期","N2 受体阻断（箭毒）→ 弛缓性麻痹；胆碱酯酶抑制（有机磷）→ ACh 蓄积"],"traps":["把终板电位当成「全或无」的动作电位","认为新斯的明可拮抗琥珀胆碱，实际只拮抗非去极化型肌松药"],"quiz":[{"q":"高镁血症为什么会导致肌无力？","a":"Mg2+ 与 Ca2+ 竞争神经末梢的钙通道，Ca2+ 内流减少，ACh 释放量下降，终板电位幅度不足以达到阈电位，肌细胞不能产生 AP，表现为弛缓性肌无力。"}],"src":["人卫版《生理学》第9版 第二章第三节；人卫版《药理学》第9版（骨骼肌松弛药章节）"]},{"id":"P14","date":"2026-11-05","module":"细胞的基本功能","prio":"A","title":"骨骼肌收缩的滑行学说与兴奋-收缩耦联","chapter":"第二章 第三节 肌细胞的收缩功能","pos":"收缩时肌丝本身并不缩短，只是相互滑行；把电信号翻译成滑行的，是 Ca2+ 这一个信号分子。","body":[{"h":"一、肌丝的分子组成","t":"粗肌丝由肌球蛋白组成，头部为横桥，具有 ATP 酶活性，可与细肌丝的肌动蛋白结合。细肌丝由肌动蛋白、原肌球蛋白与肌钙蛋白（TnC、TnI、TnT）构成。安静时原肌球蛋白遮盖肌动蛋白上的结合位点，横桥不能结合。"},{"h":"二、滑行学说","t":"收缩时细肌丝向 M 线方向滑入，肌节缩短。关键证据：收缩时 I 带与 H 带缩短，而 A 带（粗肌丝长度）不变，粗、细肌丝自身长度也不变。横桥循环：Ca2+ 与 TnC 结合 → 原肌球蛋白移位暴露位点 → 横桥与肌动蛋白结合 → 横桥摆动（需 ADP+Pi 释放）→ ATP 结合使横桥解离 → ATP 水解使横桥复位，循环往复。"},{"h":"三、兴奋-收缩耦联三环节","t":"①肌膜 AP 沿 T 管传入肌细胞深部；②在三联管处将电信号传给肌浆网，使肌浆网终池 Ca2+ 通道开放，Ca2+ 释放入肌浆（此环节依赖 T 管膜上 DHPR 与肌浆网 RyR 的机械耦联）；③Ca2+ 与肌钙蛋白结合触发横桥循环，引起收缩。舒张则依赖肌浆网钙泵（SERCA）把 Ca2+ 回收入肌浆网，肌浆 Ca2+ 浓度下降。"},{"h":"四、影响因素","t":"细胞外 Ca2+ 降低时，虽骨骼肌收缩依赖肌浆网内钙，但 T 管膜外 Ca2+ 参与耦联，故仍可致收缩减弱；咖啡因促进肌浆网释放 Ca2+，增强收缩；低氧、酸中毒抑制钙泵与横桥循环，使收缩力下降。心肌的耦联还依赖细胞外 Ca2+ 内流触发钙释放（钙触发钙释放），与骨骼肌不同。"}],"keys":["收缩时 A 带长度不变，I 带与 H 带缩短（滑行的判别标志）","耦联三环节：T 管传导 AP → 肌浆网释放 Ca2+ → Ca2+ 结合肌钙蛋白","舒张靠肌浆网钙泵回收 Ca2+，属于主动耗能过程"],"traps":["认为收缩时粗肌丝或细肌丝本身缩短","把心肌的钙触发钙释放机制套用到骨骼肌上"],"quiz":[{"q":"观察到某肌纤维收缩时 A 带长度不变而 I 带缩短，能否据此支持滑行学说？","a":"能。A 带代表粗肌丝全长，其长度不变说明粗肌丝未缩短；I 带只含细肌丝，缩短说明细肌丝向肌节中央滑入。两者结合是滑行学说最直接的形态学证据。"}],"src":["人卫版《生理学》第9版 第二章第三节；Ganong 生理学（肌肉收缩章节）"]},{"id":"P15","date":"2026-11-06","module":"细胞的基本功能","prio":"B","title":"肌肉收缩的力学表现","chapter":"第二章 第三节 肌细胞的收缩功能","pos":"同一块肌肉，前负荷决定「能出多大力」，后负荷决定「能缩多快」，二者共同决定做功。","body":[{"h":"一、等长收缩与等张收缩","t":"等长收缩：肌肉张力增加而长度不变，如站立时维持姿势、推一堵推不动的墙。等张收缩：张力不变而长度缩短，如举起可移动的重物。人体运动多为混合型，通常先等长收缩产生张力，再等张收缩缩短。"},{"h":"二、前负荷与初长度","t":"前负荷是收缩前已承受的负荷，决定肌肉的初长度。在一定范围内，初长度增加 → 粗细肌丝重叠更充分、有效横桥数目增多 → 收缩力增大；达到最适初长度时收缩力最大；超过最适初长度后重叠减少、甚至细肌丝相互干扰，收缩力下降。这一长度-张力关系是 Starling 机制的骨骼肌版本。"},{"h":"三、后负荷","t":"后负荷是收缩开始后遇到的阻力。后负荷增大 → 收缩张力增大、缩短速度减慢、缩短程度减小；当后负荷等于或超过肌肉最大张力时，肌肉不能缩短，只能做等长收缩，做功为零。故中等后负荷时做功最大（功率=力×速度的乘积关系）。"},{"h":"四、单收缩与强直收缩","t":"单收缩分潜伏期、收缩期、舒张期。连续刺激时：若刺激间隔大于单收缩时程，出现一系列单收缩；间隔小于单收缩时程但大于不应期，出现不完全强直收缩（锯齿状）；间隔进一步缩短，出现完全强直收缩（融合、幅度最大）。人体绝大多数随意运动属完全强直收缩，因其产生的张力远大于单收缩。"}],"keys":["前负荷→初长度→有效横桥数→收缩力；最适初长度时力最大","后负荷增大：张力增大、缩短速度减慢，过大则不能缩短","刺激频率增高依次出现单收缩、不完全强直、完全强直收缩"],"traps":["把等长收缩理解为「长度不变所以不做功也无张力」","认为后负荷越大做功越多，忽略缩短速度下降"],"quiz":[{"q":"为什么中等后负荷时肌肉做功最大？","a":"后负荷过小则张力小，做功少；后负荷过大则缩短速度与程度显著下降，甚至不能缩短而做功为零。做功等于张力与缩短长度之积，中等负荷使两者乘积最大。"}],"src":["人卫版《生理学》第9版 第二章第三节；Ganong 生理学（肌肉力学章节）"]}];
</script>

    function bitRol(n, c) { return n << c | n >>> 32 - c; }

  function fieldHtml(label, value) {
