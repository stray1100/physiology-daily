  /* ------------------------------------------------------------------ */
  /* 学习材料与阅读层                                                   */
  /* ------------------------------------------------------------------ */
  function materialForDate(date) { return MATERIAL_BY_DATE[date] || null; }
  function materialById(id) { return MATERIAL_BY_ID[id] || null; }
  function isMaterialRead(id) { return !!(MREAD.ids && MREAD.ids[id]); }
  function materialReadCount() {
    var n = 0;
    MATERIALS.forEach(function (m) { if (isMaterialRead(m.id)) n++; });
    return n;
  }
  function materialMinutes(m) {
    var chars = String(m.pos || '').length;
    (m.body || []).forEach(function (s) { chars += String(s.h || '').length + String(s.t || '').length; });
    (m.keys || []).forEach(function (x) { chars += String(x).length; });
    (m.traps || []).forEach(function (x) { chars += String(x).length; });
    (m.quiz || []).forEach(function (q) { chars += String(q.q || '').length + String(q.a || '').length; });
    return Math.max(3, Math.min(20, Math.round(chars / 380)));
  }
  function materialSearchText(m) {
    var parts = [m.id, m.date, m.module, m.title, m.chapter, m.pos, m.prio];
    (m.body || []).forEach(function (s) { parts.push(s.h, s.t); });
    (m.keys || []).forEach(function (x) { parts.push(x); });
    (m.traps || []).forEach(function (x) { parts.push(x); });
    (m.quiz || []).forEach(function (q) { parts.push(q.q, q.a); });
    (m.src || []).forEach(function (x) { parts.push(x); });
    return parts.join('\n');
  }
  function filteredMaterials() {
    var q = String(MQ.q || '').replace(/\s+/g, '').toLowerCase();
    var arr = MATERIAL_ORDER.slice().sort(function (a, b) { return String(b.date).localeCompare(String(a.date)); });
    return arr.filter(function (m) {
      if (MQ.filter === 'read' && !isMaterialRead(m.id)) return false;
      if (MQ.filter === 'unread' && isMaterialRead(m.id)) return false;
      if (!q) return true;
      return materialSearchText(m).replace(/\s+/g, '').toLowerCase().indexOf(q) !== -1;
    });
  }
  function materialEntryHtml(date) {
    var m = materialForDate(date);
    var read = m ? isMaterialRead(m.id) : false;
    if (m) {
      return '<div class="card material-entry">' +
        '<div class="me-top"><span class="me-badge">本日学习材料</span>' +
        '<span class="chip plain">' + esc(m.module) + '</span>' +
        (read ? '<span class="chip ok">已读</span>' : '<span class="chip">未读</span>') + '</div>' +
        '<div class="me-title">' + esc(m.title) + '</div>' +
        '<div class="me-sub">' + esc(m.pos) + '</div>' +
        '<button class="btn primary block" data-act="open-material" data-id="' + esc(m.id) + '" data-from="today">' +
        (read ? '继续阅读本日材料' : '打开本日学习材料') + ' · 约 ' + materialMinutes(m) + ' 分钟</button>' +
        '</div>';
    }
    var row = rowFor(date);
    var tp = row ? String(row[COL.type] || '') : '';
    if (tp.indexOf('复盘') !== -1 || tp.indexOf('模考') !== -1) {
      return '<div class="card"><div class="notice" style="margin:0 0 10px">' +
        '<div><b>本日无新增材料，建议复习已读材料</b><br>已读 ' + materialReadCount() + ' / ' + MATERIALS.length + ' 篇</div></div>' +
        '<button class="btn ghost block" data-act="go-materials">查看材料库</button></div>';
    }
    return '';
  }
  function renderMaterials() {
    var box = document.getElementById('matBody');
    if (!box) return;
    var read = materialReadCount();
    var chips = [['all', '全部'], ['unread', '未读'], ['read', '已读']].map(function (x) {
      return '<button class="chip' + (MQ.filter === x[0] ? ' active' : '') + '" data-act="m-filter" data-filter="' + x[0] + '">' + x[1] + '</button>';
    }).join('');
    box.innerHTML = '<div class="card">' +
      '<div class="card-head"><h2>学习材料</h2><span class="count">' + read + ' / ' + MATERIALS.length + ' 已读</span></div>' +
      '<div class="hint" style="margin:0 0 10px">按日期编排的教材精读材料；可按知识点、模块或正文关键词检索。</div>' +
      '<input class="input" id="mSearch" type="search" value="' + esc(MQ.q) + '" placeholder="搜索知识点 / 模块 / 正文关键词" autocomplete="off" aria-label="搜索学习材料">' +
      '<div class="m-chips">' + chips + '</div></div>' +
      '<div id="mList"></div>';
    renderMaterialList();
  }
  function renderMaterialList() {
    var box = document.getElementById('mList');
    if (!box) return;
    var list = filteredMaterials();
    if (!list.length) {
      box.innerHTML = '<div class="card"><div class="empty"><div class="big">—</div>没有匹配的材料<br>换个关键词，或切换上方筛选</div></div>';
      return;
    }
    var html = '';
    list.forEach(function (m) {
      var read = isMaterialRead(m.id);
      html += '<article class="m-item' + (read ? ' read' : '') + '" data-act="open-material" data-id="' + esc(m.id) + '" data-from="list" role="button" tabindex="0">' +
        '<div class="m-row"><span class="m-date">' + esc(m.date) + ' ' + esc(weekdayCN(m.date)) + '</span>' +
        '<span class="chip plain">' + esc(m.module) + '</span>' +
        (read ? '<span class="chip ok">已读</span>' : '<span class="chip">未读</span>') + '</div>' +
        '<div class="m-title">' + esc(m.title) + '</div>' +
        '<div class="m-sub">' + esc(m.chapter) + ' · 约 ' + materialMinutes(m) + ' 分钟</div>' +
        '</article>';
    });
    box.innerHTML = html;
  }
  function openMaterial(id, from) {
    var m = materialById(id);
    if (!m) { toast('未找到该材料'); return; }
    var list;
    if (from === 'today') {
      list = MATERIAL_ORDER.slice();
    } else {
      list = filteredMaterials();
      var hit = list.some(function (x) { return x.id === id; });
      if (!hit) list = MATERIAL_ORDER.slice();
    }
    READER.list = list.map(function (x) { return x.id; });
    READER.id = id;
    READER.from = from === 'today' ? 'today' : 'list';
    var reader = document.getElementById('reader');
    if (reader) {
      reader.classList.add('show');
      reader.setAttribute('aria-hidden', 'false');
    }
    document.body.classList.add('reader-open');
    renderMaterialReader();
    var sc = document.getElementById('readerScroll');
    if (sc) sc.scrollTop = 0;
  }
  function closeMaterial() {
    var reader = document.getElementById('reader');
    if (reader) {
      reader.classList.remove('show');
      reader.setAttribute('aria-hidden', 'true');
    }
    document.body.classList.remove('reader-open');
    READER.id = null;
    if (currentTab === 'materials') renderMaterialList();
    if (currentTab === 'today') renderToday();
  }
  function renderMaterialReader() {
    var m = materialById(READER.id);
    if (!m) return;
    var read = isMaterialRead(m.id);
    var idx = READER.list.indexOf(m.id);
    var head = document.getElementById('readerHead');
    var body = document.getElementById('readerBody');
    var foot = document.getElementById('readerFoot');
    if (!head || !body || !foot) return;
    head.innerHTML = '<div class="r-h-row"><span class="chip">' + esc(m.module) + '</span>' +
      '<span class="chip plain">' + esc(m.date) + ' ' + esc(weekdayCN(m.date)) + '</span>' +
      '<span class="grow" style="flex:1"></span>' +
      '<button class="icon-btn" data-act="close-material" aria-label="关闭阅读层">×</button></div>' +
      '<div class="r-h-title">' + esc(m.title) + '</div>' +
      '<div class="r-h-sub">' + esc(m.chapter) + ' · 第 ' + (idx + 1) + ' / ' + READER.list.length + ' 篇</div>';
    var html = '<div class="reader-quote"><div class="r-label">定位句</div><p>' + esc(m.pos) + '</p></div>';
    (m.body || []).forEach(function (s) {
      html += '<section class="r-sec"><h3>' + esc(s.h) + '</h3><p>' + esc(s.t) + '</p></section>';
    });
    html += '<section class="r-sec"><h3>必记要点</h3><ol class="r-list">' +
      (m.keys || []).map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ol></section>';
    html += '<section class="r-sec"><h3>易错点</h3><ul class="r-list warn">' +
      (m.traps || []).map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></section>';
    html += '<section class="r-sec"><h3>自测题<span class="r-sec-sub">答案默认折叠，点击题目展开</span></h3>' +
      (m.quiz || []).map(function (q, i) {
        return '<details class="r-quiz"><summary><span class="q-no">Q' + (i + 1) + '</span>' +
          '<span class="q-text">' + esc(q.q) + '</span><span class="q-tip">看答案</span></summary>' +
          '<div class="r-ans"><b>答案</b>' + esc(q.a) + '</div></details>';
      }).join('') + '</section>';
    html += '<section class="r-sec"><h3>出处</h3><ul class="r-src">' +
      (m.src || []).map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></section>';
    body.innerHTML = html;
    foot.innerHTML = '<div class="rf-row">' +
      '<button class="btn ghost" data-act="reader-prev"' + (idx > 0 ? '' : ' disabled') + '>上一篇</button>' +
      '<button class="btn ghost" data-act="reader-next"' + (idx < READER.list.length - 1 ? '' : ' disabled') + '>下一篇</button></div>' +
      '<div class="rf-row">' +
      '<button class="btn ' + (read ? 'ghost' : 'primary') + '" data-act="toggle-material-read" data-id="' + esc(m.id) + '">' +
      (read ? '已读 · 点此取消' : '标记已读') + '</button>' +
      '<button class="btn ghost" data-act="close-material">关闭</button></div>';
  }
  function readerStep(dir) {
    var idx = READER.list.indexOf(READER.id);
    var next = idx + dir;
    if (idx < 0 || next < 0 || next >= READER.list.length) { toast(dir < 0 ? '已经是第一篇' : '已经是最后一篇'); return; }
    READER.id = READER.list[next];
    renderMaterialReader();
    var sc = document.getElementById('readerScroll');
    if (sc) sc.scrollTop = 0;
  }
  function toggleMaterialRead(id, value) {
    if (!materialById(id)) return;
    if (value === undefined) value = !isMaterialRead(id);
    if (value) MREAD.ids[id] = nowStamp();
    else delete MREAD.ids[id];
    saveMREAD();
    if (READER.id === id) renderMaterialReader();
    if (currentTab === 'materials') renderMaterialList();
    toast(value ? '已标记为已读' : '已取消已读标记');
  }

  /* ------------------------------------------------------------------ */
  /* 答题视图                                                           */
  /* ------------------------------------------------------------------ */
  var Q = { order: [], idx: 0, ratings: {}, start: 0, total: 0, revealed: false, active: false, finished: false };

  function buildQueue() {
    var seenKey = {};
    var cards = allCards().filter(function (c) {
      var k = cardKey(c.front);
      if (seenKey[k]) return false;
      seenKey[k] = 1;
      return true;
    });
    var today = todayISO();
    var dueC = [], newC = [], restC = [];
    cards.forEach(function (c) {
      var s = ST.cards[cardKey(c.front)];
      if (s && s.due && s.due <= today) dueC.push(c);
      else if (!s) newC.push(c);
      else restC.push(c);
    });
    dueC.sort(function (a, b) {
      var x = (ST.cards[cardKey(a.front)] || {}).due || '', y = (ST.cards[cardKey(b.front)] || {}).due || '';
      return x < y ? -1 : x > y ? 1 : 0;
    });
    function shuffle(arr) {
      for (var i = arr.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = arr[i]; arr[i] = arr[j]; arr[j] = t; }
      return arr;
    }
    var order = dueC.concat(shuffle(newC)).concat(shuffle(restC));
    return { order: order.slice(0, QUIZ_SIZE), dueCount: dueC.length, newCount: newC.length };
  }

  function startQuiz() {
    var q = buildQueue();
    if (!q.order.length) { toast('卡片库为空，请先制卡'); return; }
    Q = {
      order: q.order.map(function (c) { return cardKey(c.front); }),
      idx: 0, ratings: {}, start: Date.now(), total: q.order.length,
      revealed: false, active: true, finished: false
    };
    SESS = { order: Q.order, idx: 0, ratings: {}, start: Q.start, total: Q.total };
    saveSession();
    renderQuiz();
  }

  function currentCard() { return Q.active && Q.idx < Q.order.length ? cardByKey(Q.order[Q.idx]) : null; }

  function quizSummary() {
    var answered = Object.keys(Q.ratings).length;
    var good = 0;
    Object.keys(Q.ratings).forEach(function (k) { if (Q.ratings[k] === EVAL_REMEMBER) good++; });
    return { answered: answered, good: good, pct: answered ? good * 100 / answered : 0 };
  }

  function renderQuiz() {
    var box = document.getElementById('quizBody');
    if (!Q.active && !Q.finished) {
      var q = buildQueue();
      var acc = accuracyOf();
      var learned = Object.keys(ST.cards).length;
      var dueNow = allCards().filter(function (c) { var s = ST.cards[cardKey(c.front)]; return s && s.due <= todayISO(); }).length;
      box.innerHTML =
        '<div class="card"><div class="card-head"><h2>开始一轮答题</h2></div>' +
        '<div class="field"><div class="label">本轮到期待复习</div><div class="value mono">' + dueNow + ' 张</div></div>' +
        '<div class="field"><div class="label">尚未学习的新卡</div><div class="value mono">' + q.newCount + ' 张</div></div>' +
        '<div class="field"><div class="label">卡片总数 / 已进入记忆调度</div><div class="value mono">' + allCards().length + ' 张 / ' + learned + ' 张</div></div>' +
        '<div class="field"><div class="label">累计正确率</div><div class="value mono">' + (acc.total ? acc.pct.toFixed(1) + '%（' + acc.correct + '/' + acc.total + '）' : '暂无记录') + '</div></div>' +
        '<div style="margin-top:14px"><button class="btn primary block" data-act="start-quiz">开始答题（最多 ' + QUIZ_SIZE + ' 张）</button></div>' +
        '<div class="hint">自评规则与电脑端一致：记住 → 间隔推进；模糊 → 明天重现；忘记 → 当天重现。</div></div>';
      return;
    }
    if (Q.finished) {
      var s = quizSummary();
      var totalAcc = accuracyOf();
      var cost = Math.max(1, Math.round((Date.now() - Q.start) / 1000));
      var mins = Math.floor(cost / 60), secs = cost % 60;
      box.innerHTML =
        '<div class="card"><div class="card-head"><h2>本场小结</h2></div>' +
        '<div class="tiles" style="margin-bottom:10px">' +
        '<div class="tile"><div class="k">本场正确率</div><div class="v">' + s.pct.toFixed(0) + '<small>%</small></div></div>' +
        '<div class="tile"><div class="k">本场卡片数</div><div class="v">' + s.answered + '<small>张</small></div></div>' +
        '<div class="tile"><div class="k">记住 / 模糊 / 忘记</div><div class="v" style="font-size:17px">' + countEval(EVAL_REMEMBER) + ' / ' + countEval(EVAL_VAGUE) + ' / ' + countEval(EVAL_FORGET) + '</div></div>' +
        '<div class="tile"><div class="k">用时</div><div class="v">' + mins + '<small>分</small>' + secs + '<small>秒</small></div></div>' +
        '</div>' +
        '<div class="field"><div class="label">累计正确率（全部历史）</div><div class="value mono">' +
        (totalAcc.total ? totalAcc.pct.toFixed(1) + '%（' + totalAcc.correct + '/' + totalAcc.total + '）' : '暂无记录') + '</div></div>' +
        '<div class="btn-row" style="margin-top:14px">' +
        '<button class="btn primary" data-act="start-quiz">再来一轮</button>' +
        '<button class="btn ghost" data-act="go-today">回今日任务</button></div></div>';
      return;
    }
    var card = currentCard();
    if (!card) { Q.active = false; renderQuiz(); return; }
    var s2 = quizSummary();
    var pct = Q.total ? Math.min(100, (Q.idx / Q.total) * 100) : 0;
    var html = '<div class="card tight">' +
      '<div class="quiz-stats"><span>已答 <b>' + s2.answered + '</b> / 共 ' + Q.total + '</span>' +
      '<span>正确率 <b>' + s2.pct.toFixed(0) + '%</b></span>' +
      '<span style="margin-left:auto">第 ' + Math.min(Q.idx + 1, Q.total) + ' 张</span></div>' +
      '<div class="quiz-progress"><i style="width:' + pct.toFixed(1) + '%"></i></div></div>';

    html += '<div class="flashcard">' +
      '<div class="fc-label">问题（正面）</div>' +
      '<div class="fc-front">' + esc(card.front) + '</div>' +
      (Q.revealed
        ? '<div class="fc-back">' + esc(card.back) + '</div>' +
          (card.chapter ? '<div class="fc-chapter">来源：' + esc(card.chapter) + '</div>' : '') +
          (card.tags ? '<div class="fc-chapter">标签：' + esc(card.tags) + '</div>' : '')
        : '<div class="fc-tip">先在心里回答，再点下面按钮看答案</div>') +
      '</div>';

    if (!Q.revealed) {
      html += '<button class="btn primary block" data-act="reveal">显示答案</button>';
    } else {
      html += '<div class="rate-row">' +
        '<button class="btn again" data-act="rate" data-eval="' + EVAL_FORGET + '">忘记<small>当天重现</small></button>' +
        '<button class="btn vague" data-act="rate" data-eval="' + EVAL_VAGUE + '">模糊<small>明天再来</small></button>' +
        '<button class="btn good" data-act="rate" data-eval="' + EVAL_REMEMBER + '">记住<small>间隔推进</small></button>' +
        '</div>';
    }
    html += '<div class="hint" style="text-align:center;margin-top:10px">电脑端预览时可用：空格翻面，1 忘记 / 2 模糊 / 3 记住</div>';
    box.innerHTML = html;
  }

  function countEval(e) {
    var n = 0;
    Object.keys(Q.ratings).forEach(function (k) { if (Q.ratings[k] === e) n++; });
    return n;
  }

  function grade(evaluation) {
    var card = currentCard();
    if (!card || !Q.revealed) return;
    var date = todayISO();
    applyEval(card, evaluation, date);
    addQuiz(date, 1, evaluation === EVAL_REMEMBER ? 1 : 0);
    checkin(date);
    Q.ratings[cardKey(card.front)] = evaluation;
    if (evaluation !== EVAL_REMEMBER) Q.order.push(cardKey(card.front));
    Q.idx++;
    Q.revealed = false;
    SESS = { order: Q.order, idx: Q.idx, ratings: Q.ratings, start: Q.start, total: Q.total };
    saveSession();
    if (Q.idx >= Q.order.length) {
      Q.active = false; Q.finished = true; SESS = null; saveSession();
      renderQuiz(); renderToday(); renderStats(); renderCard();
      toast('本场完成：' + quizSummary().answered + ' 张');
      return;
    }
    renderQuiz();
    renderStats();
  }

  /* ------------------------------------------------------------------ */
  /* 制卡视图                                                           */
  /* ------------------------------------------------------------------ */
  var dupPending = null;

  function renderCard() {
    var box = document.getElementById('cardBody');
    var row = rowFor(viewDate);
    var cards = allCards();
    var html = '';

    html += '<div class="card tight"><div class="card-head"><h2>按今日知识点生成骨架卡</h2></div>' +
      '<div class="hint" style="margin:0 0 12px">当前日期：' + esc(viewDate) + (row ? ' · ' + esc(row[COL.module]) : '') + '</div>' +
      '<button class="btn ghost block" data-act="skeleton"' + (row ? '' : ' disabled') + '>用「' + (row ? esc(String(row[COL.kn]).slice(0, 14)) + (String(row[COL.kn]).length > 14 ? '…' : '') : '该日无知识点') + '」填充</button></div>';

    html += '<div class="card"><div class="card-head"><h2>手动制卡</h2><span class="count">共 ' + cards.length + ' 张</span></div>' +
      '<div class="form-row"><label>正面（问题）</label><input class="input" id="fFront" placeholder="如：【呼吸系统】CAP 的诊断标准"></div>' +
      '<div class="form-row"><label>背面（答案）</label><textarea class="input" id="fBack" placeholder="写下必须记住的要点"></textarea></div>' +
      '<div class="form-row"><label>标签（可选）</label><input class="input" id="fTags" placeholder="生理学精要 呼吸系统 A必掌握"></div>' +
      '<div class="form-row"><label>来源章节（可选）</label><input class="input" id="fChap" placeholder="第二篇 第二章 第三节"></div>' +
      '<div id="dupBox"></div>' +
      '<button class="btn primary block" data-act="save-card">保存卡片</button>' +
      '<div class="hint">卡片保存在本机浏览器；重复正面会被识别并提示。</div></div>';

    html += '<div class="card"><div class="card-head"><h2>卡片库</h2><span class="count">最近 ' + Math.min(8, cards.length) + ' 张</span></div>';
    if (!cards.length) {
      html += '<div class="empty">还没有卡片</div>';
    } else {
      cards.slice(-8).reverse().forEach(function (c) {
        var s = ST.cards[cardKey(c.front)];
        var tag = s ? ('已复习 ' + num(s.reps) + ' 次 · 下次 ' + s.due) : '未学习';
        html += '<div class="check-row" style="border-top:1px dashed var(--line)">' +
          '<div class="body"><div class="t1" style="text-decoration:none">' + esc(c.front) + '</div>' +
          '<div class="t2">' + esc(tag) + (c.src === 'local' ? ' · 本机新增' : '') + '</div></div></div>';
      });
    }
    html += '</div>';
    box.innerHTML = html;
  }

  function fillSkeleton() {
    var row = rowFor(viewDate);
    if (!row) { toast('该日没有知识点'); return; }
    document.getElementById('fFront').value = '【' + (row[COL.module] || '') + '】' + (row[COL.kn] || '');
    document.getElementById('fBack').value = row[COL.key] || '';
    document.getElementById('fTags').value = ['生理学精要', row[COL.module], row[COL.prio]].filter(Boolean).join(' ');
    document.getElementById('fChap').value = row[COL.chap] || '';
    toast('已填充骨架卡，可修改后保存');
  }

  function saveCard(force) {
    var front = (document.getElementById('fFront').value || '').trim();
    var back = (document.getElementById('fBack').value || '').trim();
    var tags = (document.getElementById('fTags').value || '').trim();
    var chap = (document.getElementById('fChap').value || '').trim();
    var dup = document.getElementById('dupBox');
    if (!front) { dup.innerHTML = '<div class="notice err">正面不能为空</div>'; return; }
    if (!back) { dup.innerHTML = '<div class="notice err">背面不能为空</div>'; return; }
    var hit = null;
    allCards().forEach(function (c) { if (normText(c.front) === normText(front)) hit = c; });
    if (hit && !force) {
      dup.innerHTML = '<div class="notice">已存在相同正面的卡片，未重复添加。' +
        '<button class="btn ghost" style="min-height:34px;padding:0 10px;margin-left:8px;font-size:13px" data-act="force-save">仍要添加</button></div>';
      dupPending = { front: front, back: back, tags: tags, chapter: chap };
      return;
    }
    EXTRA.push({ front: front, back: back, tags: tags, chapter: chap, created: nowStamp() });
    saveExtra();
    dupPending = null;
    dup.innerHTML = '<div class="notice ok">已保存：' + esc(front.slice(0, 24)) + '</div>';
    toast('卡片已保存到本机');
    renderCard();
    var again = document.getElementById('dupBox');
    if (again) again.innerHTML = '<div class="notice ok">已保存：' + esc(front.slice(0, 24)) + '</div>';
    renderQuiz();
    renderStats();
  }

  /* ------------------------------------------------------------------ */
  /* 统计视图                                                           */
  /* ------------------------------------------------------------------ */
  function renderStats() {
    var box = document.getElementById('statsBody');
    var today = todayISO();
    var doneDays = 0;
    Object.keys(PG.daily).forEach(function (d) { if (PG.daily[d] && PG.daily[d].new_knowledge_done) doneDays++; });
    var planPct = PLAN.length ? doneDays * 100 / PLAN.length : 0;
    var st = streak(today);
    var dq = dueFor(today);
    var dueDone = dq.due.filter(function (x) { return isReviewDone(x.trainDate, x.mark); }).length;
    var todayPct = dq.due.length ? Math.round(dueDone * 100 / dq.due.length) : (dayRec(today).new_knowledge_done ? 100 : 0);
    var acc7 = accuracyOf(7);
    var accAll = accuracyOf();
    var cards = allCards();
    var learned = Object.keys(ST.cards).length;

    var html = '<div class="tiles">' +
      tile('计划进度', planPct.toFixed(1), '%', doneDays + '/' + PLAN.length + ' 天') +
      tile('连续打卡', st, ' 天', '今日' + (PG.checkin_dates.indexOf(today) !== -1 ? '已' : '未') + '打卡') +
      tile('今日完成度', todayPct, '%', dq.due.length ? (dueDone + '/' + dq.due.length + ' 项复习') : '无到期复习') +
      tile('卡片掌握', learned, ' 张', '共 ' + cards.length + ' 张') +
      '</div>';

    html += '<div class="card"><div class="card-head"><h2>正确率</h2></div>' +
      '<div class="field"><div class="label">近 7 天</div><div class="value mono">' +
      (acc7.total ? acc7.pct.toFixed(1) + '%（' + acc7.correct + '/' + acc7.total + '）' : '暂无记录') + '</div></div>' +
      '<div class="field"><div class="label">累计</div><div class="value mono">' +
      (accAll.total ? accAll.pct.toFixed(1) + '%（' + accAll.correct + '/' + accAll.total + '）' : '暂无记录') + '</div></div>' +
      '<div class="field"><div class="label">自评分布</div><div class="value mono">记住 ' + num(SS.by_eval[EVAL_REMEMBER]) +
      ' · 模糊 ' + num(SS.by_eval[EVAL_VAGUE]) + ' · 忘记 ' + num(SS.by_eval[EVAL_FORGET]) + '</div></div></div>';

    /* Top10 */
    var rows = [];
    Object.keys(SS.forget_counter).forEach(function (f) {
      rows.push({ front: f, forget: num(SS.forget_counter[f]), vague: num(SS.vague_counter[f] || 0) });
    });
    Object.keys(SS.vague_counter).forEach(function (f) {
      if (!SS.forget_counter[f]) rows.push({ front: f, forget: 0, vague: num(SS.vague_counter[f]) });
    });
    rows.sort(function (a, b) { return (b.forget * 2 + b.vague) - (a.forget * 2 + a.vague); });
    html += '<div class="card"><div class="card-head"><h2>忘记 / 模糊 Top10</h2></div>';
    if (!rows.length) {
      html += '<div class="empty">还没有记录，答题自评后这里会列出薄弱知识点</div>';
    } else {
      html += '<ol class="rank">';
      rows.slice(0, 10).forEach(function (r) {
        html += '<li>' + esc(r.front) + '<span class="n">忘 ' + r.forget + ' · 模 ' + r.vague + '</span></li>';
      });
      html += '</ol>';
    }
    html += '</div>';

    /* 热力 30 天 */
    html += '<div class="card"><div class="card-head"><h2>近 30 天学习热力</h2></div><div class="heat">';
    var start = addDays(today, -29);
    for (var i = 0; i < 30; i++) {
      var d = addDays(start, i);
      var rec = PG.daily[d] || {};
      var lvl = 0;
      if (rec.new_knowledge_done) lvl++;
      if (rec.quiz_total > 0) lvl++;
      var revCount = (rec.reviews_done || []).length;
      if (revCount >= 3) lvl++;
      var cls = 'cell' + (lvl ? ' l' + Math.min(lvl, 3) : '') + (d === today ? ' today' : '');
      html += '<div class="' + cls + '" title="' + esc(d) + '">' + (+d.slice(8, 10)) + '</div>';
    }
    html += '</div><div class="heat-legend"><span>少</span><i style="background:var(--surface-2)"></i>' +
      '<i style="background:var(--accent-soft)"></i><i style="background:var(--accent-line)"></i>' +
      '<i style="background:var(--accent)"></i><span>多</span>' +
      '<span style="margin-left:auto">打卡 ' + PG.checkin_dates.length + ' 天</span></div></div>';

    /* 数据管理 */
    html += '<div class="card"><div class="card-head"><h2>数据管理</h2></div>' +
      '<div class="hint" style="margin:0 0 12px">所有数据存于本机浏览器，不上传任何服务器。换手机/清理浏览器前请先导出备份。</div>' +
      '<div class="btn-row" style="margin-bottom:10px">' +
      '<button class="btn primary" data-act="export">导出进度 JSON</button>' +
      '<button class="btn ghost" data-act="import">导入进度 JSON</button></div>' +
      '<div class="btn-row">' +
      '<button class="btn ghost" data-act="show-json">查看 JSON 文本</button>' +
      '<button class="btn ghost" data-act="clear">清空本机数据</button></div>' +
      '<input type="file" id="fileImport" accept=".json,application/json" style="display:none">' +
      '<div class="hint">导入采用「并集 + 取较大值」合并，多次导入不会重复累加。</div></div>';

    html += '<div class="footer-note">生理学每日学习助手 · 移动离线版 v' + APP_VER +
      '<br>数据源：123 天知识点计划（' + esc(PLAN_START) + ' 起）· ' + BASE_CARDS.length + ' 张初始卡片' +
      '<br>学习材料 ' + MATERIALS.length + ' 篇 · 生成时间：' + esc(DATA.generated || '') + '</div>';

    box.innerHTML = html;
    var fi = document.getElementById('fileImport');
    if (fi) fi.addEventListener('change', onImportFile);
  }

  function tile(k, v, unit, sub) {
    return '<div class="tile"><div class="k">' + esc(k) + '</div><div class="v">' + esc(v) +
      '<small>' + esc(unit) + '</small></div><div class="hint" style="margin-top:2px">' + esc(sub) + '</div></div>';
  }

  /* ------------------------------------------------------------------ */
  /* 导入导出                                                           */
  /* ------------------------------------------------------------------ */
  function buildExport() {
    return {
      app: APP_ID,
      app_name: '生理学每日学习助手（移动版）',
      version: APP_VER,
      exported_at: nowStamp(),
      source: 'mobile-offline-html',
      progress: PG,
      card_state: ST,
      stats: SS,
      extra_cards: EXTRA
    };
  }

  function downloadJSON(obj, name) {
    try {
      var text = JSON.stringify(obj, null, 1);
      var blob = new Blob([text], { type: 'application/json;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 800);
      return true;
    } catch (e) { return false; }
  }

  function exportData() {
    var obj = buildExport();
    var name = '生理学每日学习助手进度_' + todayISO() + '.json';
    var ok = downloadJSON(obj, name);
    toast(ok ? '已导出：' + name : '当前环境不支持直接下载，已改为文本方式');
    if (!ok) openJSONSheet(JSON.stringify(obj, null, 1));
  }

  function openJSONSheet(text) {
    openSheet('<h3>进度 JSON（可复制保存）</h3>' +
      '<textarea id="jsonText" readonly></textarea>' +
      '<div class="btn-row" style="margin-top:12px">' +
      '<button class="btn primary" data-act="copy-json">复制</button>' +
      '<button class="btn ghost" data-act="close-sheet">关闭</button></div>');
    var ta = document.getElementById('jsonText');
    ta.value = text;
    ta.addEventListener('focus', function () { this.select(); });
  }

  function mergeProgress(a, b) {
    var out = normProgress(JSON.parse(JSON.stringify(a || {})));
    var inc = normProgress(b || {});
    inc.checkin_dates.forEach(function (d) { if (out.checkin_dates.indexOf(d) === -1) out.checkin_dates.push(d); });
    out.checkin_dates.sort();
    inc.completed_reviews.forEach(function (t) { if (out.completed_reviews.indexOf(t) === -1) out.completed_reviews.push(t); });
    Object.keys(inc.daily).forEach(function (d) {
      var x = out.daily[d] || {}, y = inc.daily[d] || {};
      out.daily[d] = {
        new_knowledge_done: !!(x.new_knowledge_done || y.new_knowledge_done),
        reviews_done: (x.reviews_done || []).concat((y.reviews_done || []).filter(function (t) { return (x.reviews_done || []).indexOf(t) === -1; })),
        quiz_total: Math.max(num(x.quiz_total), num(y.quiz_total)),
        quiz_correct: Math.max(num(x.quiz_correct), num(y.quiz_correct))
      };
    });
    out.updated = nowStamp();
    return out;
  }

  function mergeState(a, b) {
    var out = normState(JSON.parse(JSON.stringify(a || {})));
    var inc = normState(b || {});
    Object.keys(inc.cards).forEach(function (k) {
      var x = out.cards[k], y = inc.cards[k];
      if (!x) { out.cards[k] = y; return; }
      var newer = String(y.last_review || '') > String(x.last_review || '') ||
        (String(y.last_review || '') === String(x.last_review || '') && num(y.reps) > num(x.reps));
      if (newer) out.cards[k] = y;
      else if (num(y.reps) === num(x.reps) && num(y.lapses) > num(x.lapses)) { x.lapses = num(y.lapses); }
    });
    out.updated = nowStamp();
    return out;
  }

  function mergeStats(a, b) {
    var out = normStats(JSON.parse(JSON.stringify(a || {})));
    var inc = normStats(b || {});
    out.total_answers = Math.max(num(out.total_answers), num(inc.total_answers));
    out.correct = Math.max(num(out.correct), num(inc.correct));
    out.wrong = Math.max(num(out.wrong), num(inc.wrong));
    [EVAL_REMEMBER, EVAL_VAGUE, EVAL_FORGET].forEach(function (e) {
      out.by_eval[e] = Math.max(num(out.by_eval[e]), num(inc.by_eval[e]));
    });
    [['forget_counter'], ['vague_counter']].forEach(function (p) {
      var key = p[0];
      Object.keys(inc[key]).forEach(function (f) { out[key][f] = Math.max(num(out[key][f]), num(inc[key][f])); });
    });
    Object.keys(inc.daily).forEach(function (d) {
      var x = out.daily[d] || { total: 0, correct: 0 }, y = inc.daily[d] || { total: 0, correct: 0 };
      out.daily[d] = { total: Math.max(num(x.total), num(y.total)), correct: Math.max(num(x.correct), num(y.correct)) };
    });
    var seen = {};
    out.history.forEach(function (h) { seen[h.date + '|' + h.front + '|' + h.eval] = 1; });
    inc.history.forEach(function (h) {
      if (!seen[h.date + '|' + h.front + '|' + h.eval]) { out.history.push(h); seen[h.date + '|' + h.front + '|' + h.eval] = 1; }
    });
    out.history = out.history.slice(-1000);
    out.updated = nowStamp();
    return out;
  }

  function importPayload(obj) {
    if (!obj || typeof obj !== 'object') throw new Error('文件内容不是有效的 JSON 对象');
    if (!obj.progress && !obj.card_state && !obj.stats) {
      throw new Error('未找到 progress / card_state / stats 字段，可能不是本应用的进度文件');
    }
    PG = mergeProgress(PG, obj.progress || {});
    ST = mergeState(ST, obj.card_state || {});
    SS = mergeStats(SS, obj.stats || {});
    if (Array.isArray(obj.extra_cards)) {
      obj.extra_cards.forEach(function (c) {
        if (!c || !c.front) return;
        var exists = EXTRA.some(function (e) { return normText(e.front) === normText(c.front); });
        if (!exists) EXTRA.push({ front: c.front, back: c.back || '', tags: c.tags || '', chapter: c.chapter || '', created: c.created || nowStamp() });
      });
    }
    savePG(); saveST(); saveSS(); saveExtra();
    refreshAll();
  }

  function onImportFile(e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var obj = JSON.parse(String(reader.result));
        importPayload(obj);
        toast('导入完成：已合并到本机数据');
        openSheet('<h3>导入完成</h3><div class="notice ok">数据已合并（并集 + 取较大值），不会重复累加。</div>' +
          '<div class="field"><div class="label">连续打卡</div><div class="value">' + streak(todayISO()) + ' 天</div></div>' +
          '<div class="field"><div class="label">已完成学习天数</div><div class="value">' +
          Object.keys(PG.daily).filter(function (d) { return PG.daily[d] && PG.daily[d].new_knowledge_done; }).length + ' 天</div></div>' +
          '<div class="btn-row" style="margin-top:12px"><button class="btn primary" data-act="close-sheet">知道了</button></div>');
      } catch (err) {
        openSheet('<h3>导入失败</h3><div class="notice err">' + esc(err.message || 'JSON 解析失败') + '</div>' +
          '<div class="btn-row" style="margin-top:12px"><button class="btn ghost" data-act="close-sheet">关闭</button></div>');
      }
    };
    reader.readAsText(f, 'utf-8');
    e.target.value = '';
  }

  function clearData() {
    openSheet('<h3>清空本机数据</h3>' +
      '<div class="notice err">将删除本机保存的进度、卡片调度、统计与本机新增卡片，操作不可撤销。建议先导出备份。</div>' +
      '<div class="btn-row"><button class="btn ghost" data-act="close-sheet">取消</button>' +
      '<button class="btn primary" data-act="clear-confirm">确认清空</button></div>');
  }
  function clearConfirm() {
    [K.pg, K.st, K.ss, K.ex, K.qs, K.mark].forEach(function (k) { store.del(k); });
    loadAll();
    Q = { order: [], idx: 0, ratings: {}, start: 0, total: 0, revealed: false, active: false, finished: false };
    closeSheet();
    refreshAll();
    toast('已清空本机数据');
  }

  /* 使用说明                                                           */
  /* ------------------------------------------------------------------ */

    '全部存于本机浏览器本地存储（localStorage），不联网、不上传。换手机、清理浏览器数据、使用无痕模式前，请先在「统计 → 导出进度 JSON」备份。</div></div>' +
    '<div class="field"><div class="label">4. 与电脑端互通</div><div class="value">' +
    '电脑端网页版 data 目录下的 progress.json / card_state.json / stats.json 与导出文件字段一一对应：' +
    'progress.json ↔ progress；card_state.json ↔ card_state；stats.json ↔ stats。' +
    '把电脑端三个文件的内容合并成 {"progress":…,"card_state":…,"stats":…} 即可在手机上导入；反向把手机导出的 JSON 拆开对应字段写回电脑端即可。</div></div>' +
    '<div class="field"><div class="label">5. 常见问题</div><div class="value">' +
    '· 换个浏览器打开发现数据「消失」：不同浏览器存储互相独立，请固定用同一个浏览器。<br>' +
    '· 点「导出」没反应：部分手机浏览器限制本地文件下载，改用「查看 JSON 文本 → 复制」保存。<br>' +
    '· 日期不在范围内：计划表覆盖 ' + esc(PLAN_START) + ' 至 ' + esc(PLAN_END) + '，可用日期选择器回到区间内。</div></div>' +
    '<div class="field"><div class="label">6. 浏览器兼容</div><div class="value">' +
    '推荐 Chrome / Edge 80+、Safari 14+、夸克、UC、三星浏览器。需支持 localStorage、CSS 变量与 grid；过老的内置浏览器可能样式降级。</div></div>' +
    '<div class="btn-row" style="margin-top:12px"><button class="btn primary" data-act="close-sheet">知道了</button></div>';

  /* ------------------------------------------------------------------ */
  /* 路由与事件                                                         */
  /* ------------------------------------------------------------------ */
  var TABS = ['today', 'quiz', 'card', 'stats', 'materials'];
  var currentTab = 'today';

  function switchTab(tab) {
    if (TABS.indexOf(tab) === -1) tab = 'today';
    currentTab = tab;
    TABS.forEach(function (t) {
      var v = document.getElementById('view-' + t);
      if (v) v.classList.toggle('active', t === tab);
      var b = document.querySelector('.tab[data-tab="' + t + '"]');
      if (b) {
        b.classList.toggle('active', t === tab);
        b.setAttribute('aria-selected', t === tab ? 'true' : 'false');
      }
    });
    if (tab === 'today') renderToday();
    if (tab === 'quiz') renderQuiz();
    if (tab === 'card') renderCard();
    if (tab === 'stats') renderStats();
    if (tab === 'materials') renderMaterials();
    window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
  }

  function refreshAll() {
    renderToday(); renderQuiz(); renderCard(); renderStats(); renderMaterials();
  }

  function onAction(act, el) {
    switch (act) {
      case 'prev-day': viewDate = addDays(viewDate, -1); renderToday(); break;
      case 'next-day': viewDate = addDays(viewDate, 1); renderToday(); break;
      case 'jump-today': viewDate = defaultViewDate(); renderToday(); break;
      case 'toggle-new': {
        var cur = dayRec(viewDate).new_knowledge_done;
        setNewDone(viewDate, !cur);
        if (!cur) checkin(viewDate);
        renderToday(); renderStats();
        toast(!cur ? '已标记完成，并计入打卡' : '已取消完成标记');
        break;
      }
      case 'toggle-review': {
        var td = el.getAttribute('data-td'), mk = el.getAttribute('data-mk');
        var done = isReviewDone(td, mk);
        markReviewDone(td, mk, !done);
        if (!done) checkin(todayISO());
        renderToday(); renderStats();
        toast(!done ? '复习项已完成' : '已取消该复习项');
        break;
      }
      case 'done-all': {
        setNewDone(viewDate, true);
        var dq = dueFor(viewDate);
        dq.due.forEach(function (it) { markReviewDone(it.trainDate, it.mark, true); });
        checkin(viewDate);
        renderToday(); renderStats();
        toast('今日任务已全部完成（含 ' + dq.due.length + ' 项复习）');
        break;
      }
      case 'go-quiz': switchTab('quiz'); break;
      case 'go-materials': switchTab('materials'); break;
      case 'open-material': openMaterial(el.getAttribute('data-id'), el.getAttribute('data-from') || 'list'); break;
      case 'close-material': closeMaterial(); break;
      case 'reader-prev': readerStep(-1); break;
      case 'reader-next': readerStep(1); break;
      case 'toggle-material-read': toggleMaterialRead(el.getAttribute('data-id')); break;
      case 'm-filter': MQ.filter = el.getAttribute('data-filter') || 'all'; renderMaterials(); break;
      case 'go-today': switchTab('today'); break;
      case 'start-quiz': startQuiz(); break;
      case 'reveal': Q.revealed = true; renderQuiz(); break;
      case 'rate': grade(el.getAttribute('data-eval')); break;
      case 'skeleton': fillSkeleton(); break;
      case 'save-card': saveCard(false); break;
      case 'force-save': if (dupPending) { saveCard(true); } break;
      case 'export': exportData(); break;
      case 'import': {
        var fi = document.getElementById('fileImport');
        if (fi) fi.click();
        break;
      }
      case 'show-json': openJSONSheet(JSON.stringify(buildExport(), null, 1)); break;
      case 'copy-json': {
        var ta = document.getElementById('jsonText');
        if (ta) {
          ta.select();
          var okc = false;
          try { okc = document.execCommand('copy'); } catch (e) {}
          toast(okc ? '已复制到剪贴板' : '请长按文本框手动复制');
        }
        break;
      }
      case 'clear': clearData(); break;
      case 'clear-confirm': clearConfirm(); break;
      case 'close-sheet': closeSheet(); break;
      case 'help': openSheet(HELP_HTML); break;
      default: break;
    }
  }

  function bind() {
    document.addEventListener('click', function (e) {
      var t = e.target.closest ? e.target.closest('[data-act]') : null;
      if (t) {
        e.preventDefault();
        onAction(t.getAttribute('data-act'), t);
        return;
      }
      var tab = e.target.closest ? e.target.closest('.tab') : null;
      if (tab) { switchTab(tab.getAttribute('data-tab')); return; }
      if (e.target.id === 'sheet') closeSheet();
    });
    document.addEventListener('input', function (e) {
      if (e.target && e.target.id === 'mSearch') {
        MQ.q = e.target.value || '';
        renderMaterialList();
      }
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && READER.id) { closeMaterial(); return; }
      var tag = (e.target.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'textarea') return;
      if (currentTab !== 'quiz' || !Q.active) return;
      if (e.code === 'Space') { e.preventDefault(); if (!Q.revealed) { Q.revealed = true; renderQuiz(); } }
      if (Q.revealed && (e.key === '1' || e.key === '2' || e.key === '3')) {
        grade(e.key === '1' ? EVAL_FORGET : e.key === '2' ? EVAL_VAGUE : EVAL_REMEMBER);
      }
    });
  }

  /* ------------------------------------------------------------------ */
  /* 自检（?selftest=1）                                                */
  /* ------------------------------------------------------------------ */
  function runSelfTest() {
    var out = [];
    function t(name, cond, info) { out.push({ name: name, pass: !!cond, info: info == null ? '' : String(info) }); }
    var backup = {
      pg: JSON.stringify(PG), st: JSON.stringify(ST), ss: JSON.stringify(SS),
      ex: JSON.stringify(EXTRA), sess: store.raw(K.qs),
      mr: JSON.stringify(MREAD), vd: viewDate
    };

    /* 1-4 数据完整性 */
    t('计划数据条数=123', PLAN.length === 123, '实际 ' + PLAN.length);
    var gap = 0;
    for (var i = 1; i < PLAN.length; i++) {
      if (addDays(PLAN[i - 1][COL.date], 1) !== PLAN[i][COL.date]) gap++;
    }
    t('计划日期连续无缺口', gap === 0, '缺口 ' + gap);
    t('内嵌卡片数=102', BASE_CARDS.length === 102, '实际 ' + BASE_CARDS.length);
    var r0 = rowFor('2026-10-21');
    t('今日字段完整', !!r0 && !!r0[COL.module] && !!r0[COL.kn] && !!r0[COL.chap] && !!r0[COL.goal] && !!r0[COL.key] && !!r0[COL.task],
      r0 ? (r0[COL.module] + ' / ' + r0[COL.kn]) : '未找到 2026-10-21');

    /* 5 到期与逾期 */
    var d0 = dueFor('2026-10-22');
    t('2026-10-22 到期复习=1（第1天 D1）', d0.due.length === 1 && d0.due[0].mark === 'D1' && d0.due[0].trainDate === '2026-10-21',
      '实际 ' + d0.due.length + (d0.due[0] ? ' / ' + d0.due[0].mark + '@' + d0.due[0].trainDate : ''));
    t('2026-10-21 无到期项（计划首日）', dueFor('2026-10-21').due.length === 0, '实际 ' + dueFor('2026-10-21').due.length);
    var dLater = dueFor('2026-12-31');
    t('逾期项计算正常', dLater.overdue.length > 0 && dLater.overdue.every(function (x) { return x.late > 0; }),
      '逾期 ' + dLater.overdue.length + ' 项');

    /* 6 勾选写入 */
    setNewDone('2026-10-21', true);
    var reread = JSON.parse(store.raw(K.pg) || '{}');
    t('勾选新知识点已持久化', reread.daily && reread.daily['2026-10-21'] && reread.daily['2026-10-21'].new_knowledge_done === true, '');
    markReviewDone('2026-10-21', 'D1', true);
    var reread2 = JSON.parse(store.raw(K.pg) || '{}');
    t('复习勾选已写入 completed_reviews', (reread2.completed_reviews || []).indexOf('2026-10-21|D1') !== -1, '');

    /* 7 重新加载（模拟刷新） */
    var before = JSON.stringify({ p: PG.daily['2026-10-21'].new_knowledge_done, tags: PG.completed_reviews.length });
    loadAll();
    var after = JSON.stringify({ p: PG.daily['2026-10-21'].new_knowledge_done, tags: PG.completed_reviews.length });
    t('刷新后本地数据不丢失', before === after, before + ' → ' + after);

    /* 8 答题调度 */
    startQuiz();
    t('答题会话建立（≤20 张）', Q.active && Q.order.length > 0 && Q.order.length <= 20, '本场 ' + Q.order.length + ' 张');
    var firstKey = Q.order[0];
    Q.revealed = true;
    var dueBefore = (ST.cards[firstKey] || {}).due;
    grade(EVAL_REMEMBER);
    var s1 = ST.cards[firstKey] || {};
    t('记住 → 间隔推进且下次日期后移', num(s1.interval_index) >= 1 && s1.due > todayISO(), 'due ' + s1.due + '（原 ' + (dueBefore || '-') + '）');
    Q.revealed = true;
    var secondKey = Q.order[Q.idx];
    grade(EVAL_FORGET);
    t('忘记 → 当天重现（队列追加）', Q.order.lastIndexOf(secondKey) > Q.idx - 1, '队列长度 ' + Q.order.length);
    Q.revealed = true;
    grade(EVAL_VAGUE);
    var summ = quizSummary();
    t('正确率口径=记住/已答', summ.answered > 0 && Math.abs(summ.pct - summ.good * 100 / summ.answered) < 0.001,
      summ.good + '/' + summ.answered + ' = ' + summ.pct.toFixed(1) + '%');
    t('答题已记入 progress.daily', num(dayRec(todayISO()).quiz_total) >= 3, 'quiz_total=' + dayRec(todayISO()).quiz_total);
    t('答题已记入 stats', num(SS.total_answers) >= 3, 'total_answers=' + SS.total_answers);

    /* 9 制卡 */
    var dupFront = BASE_CARDS[0].f;
    var hit = allCards().filter(function (c) { return normText(c.front) === normText(dupFront); });
    t('重复检测可命中', hit.length >= 1, '命中 ' + hit.length + ' 张');
    var keyBefore = cardKey(dupFront);
    t('卡片键与电脑端算法一致(12位md5)', keyBefore.length === 12 && /^[0-9a-f]{12}$/.test(keyBefore), keyBefore);
    var extraBefore = EXTRA.length;
    EXTRA.push({ front: '__selftest__ ' + Date.now(), back: 'x', tags: '', chapter: '', created: nowStamp() });
    saveExtra();
    t('新增卡片已持久化', (store.get(K.ex) || []).length === extraBefore + 1, '');
    EXTRA.pop(); saveExtra();

    /* 10 导入导出往返 */
    var exp = buildExport();
    var text = JSON.stringify(exp);
    var back = JSON.parse(text);
    t('导出 JSON 结构完整', !!back.progress && !!back.card_state && !!back.stats && back.app === APP_ID, 'app=' + back.app);
    var accBefore = accuracyOf();
    importPayload(back);
    var accAfter = accuracyOf();
    t('导入导出往返一致（不翻倍）', Math.abs(accBefore.pct - accAfter.pct) < 0.001 &&
      num(accBefore.total) === num(accAfter.total), accBefore.total + ' → ' + accAfter.total);

    /* 11 统计与渲染 */
    var doneDays = Object.keys(PG.daily).filter(function (d) { return PG.daily[d] && PG.daily[d].new_knowledge_done; }).length;
    t('计划进度口径正确', Math.abs(doneDays * 100 / PLAN.length - doneDays * 100 / 123) < 1e-9, doneDays + '/' + PLAN.length);
    switchTab('stats');
    var cells = document.querySelectorAll('.heat .cell');
    t('热力图 30 格', cells.length === 30, '实际 ' + cells.length);

    /* 12 布局 */
    switchTab('today');
    var sw = document.documentElement.scrollWidth, iw = window.innerWidth;
    t('无横向溢出', sw <= iw + 1, 'scrollWidth=' + sw + ' innerWidth=' + iw);
    var btn = document.querySelector('.tab');
    var tapH = btn ? btn.getBoundingClientRect().height : 0;
    if (!tapH) tapH = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--tap')) || 0;
    t('点击区高度≥44px', tapH >= 44, tapH ? Math.round(tapH) + 'px' : 'no tab');
    var fsb = parseFloat(getComputedStyle(document.body).fontSize);
    if (!fsb) fsb = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--fs-body')) || 0;
    t('正文基准字号≥16px', fsb >= 16, fsb + 'px');


    /* 13 学习材料 */
    t('材料条数=15', MATERIALS.length === 15, '实际 ' + MATERIALS.length);
    var badMat = MATERIALS.filter(function (m) {
      return !m.id || !m.date || !m.module || !m.title || !m.pos || !m.chapter ||
        !Array.isArray(m.body) || !m.body.length || !Array.isArray(m.keys) || !m.keys.length ||
        !Array.isArray(m.traps) || !m.traps.length || !Array.isArray(m.quiz) || !m.quiz.length ||
        !Array.isArray(m.src) || !m.src.length;
    });
    t('材料字段完整', badMat.length === 0, badMat.length ? badMat.map(function (m) { return m.id; }).join(',') : '15/15');
    var matDates = {}, dupDate = 0;
    MATERIALS.forEach(function (m) { if (matDates[m.date]) dupDate++; matDates[m.date] = 1; });
    var notNew = MATERIALS.filter(function (m) { var r = rowFor(m.date); return !r || r[COL.type] !== '新知识点'; });
    t('15 个新知识点日期全覆盖', Object.keys(matDates).length === 15 && dupDate === 0 && notNew.length === 0,
      '日期 ' + Object.keys(matDates).length + ' / 非新知识点 ' + notNew.length);
    MQ.q = ''; MQ.filter = 'all';
    switchTab('materials');
    t('材料列表渲染 15 条', document.querySelectorAll('#mList .m-item').length === 15,
      'DOM ' + document.querySelectorAll('#mList .m-item').length);
    var m0 = MATERIAL_ORDER[0];
    openMaterial(m0.id, 'today');
    t('阅读层可打开', document.getElementById('reader').classList.contains('show'), m0.id + ' ' + m0.title);
    var rb = document.getElementById('readerBody');
    t('阅读层六段结构完整', rb.querySelectorAll('.reader-quote').length === 1 &&
      rb.querySelectorAll('.r-sec').length >= 4 && rb.querySelectorAll('.r-quiz').length === m0.quiz.length,
      '定位句 ' + rb.querySelectorAll('.reader-quote').length + ' / 分节 ' + rb.querySelectorAll('.r-sec').length +
      ' / 自测 ' + rb.querySelectorAll('.r-quiz').length);
    var allClosed = true;
    rb.querySelectorAll('.r-quiz').forEach(function (d) { if (d.open) allClosed = false; });
    t('自测答案默认折叠', rb.querySelectorAll('.r-quiz').length === m0.quiz.length && allClosed,
      'details ' + rb.querySelectorAll('.r-quiz').length);
    var rp = rb.querySelector('.reader-quote p');
    var rcs = getComputedStyle(rp);
    var flh = parseFloat(rcs.lineHeight) || 0, ffs = parseFloat(rcs.fontSize) || 0;
    if (flh && flh < 2.5) flh = flh * ffs;
    t('阅读正文≥16px 行高≥1.7', ffs >= 16 && flh / ffs >= 1.7, ffs + 'px / ' + Math.round(flh) + 'px');
    var rsc = document.getElementById('readerScroll');
    t('阅读层 390px 无横向滚动', rsc.scrollWidth <= rsc.clientWidth + 1,
      'scrollWidth=' + rsc.scrollWidth + ' clientWidth=' + rsc.clientWidth);
    toggleMaterialRead(m0.id, true);
    var mrBack = JSON.parse(store.raw(K.mr) || '{}');
    t('材料已读状态已持久化', !!(mrBack.ids && mrBack.ids[m0.id]), m0.id);
    t('材料库显示已读标记', !!document.querySelector('#mList .m-item.read'), '');
    closeMaterial();
    viewDate = m0.date;
    switchTab('today');
    t('今日页显示材料入口', !!document.querySelector('[data-act="open-material"]'), m0.date);
    viewDate = '2026-10-26';
    renderToday();
    var promptText = document.getElementById('todayBody').textContent;
    t('复盘日显示无新增材料提示', promptText.indexOf('本日无新增材料') !== -1 && promptText.indexOf('建议复习已读材料') !== -1, '');
    closeMaterial();
    MQ.q = ''; MQ.filter = 'all';

    /* 还原现场 */
    try {
      PG = normProgress(JSON.parse(backup.pg));
      ST = normState(JSON.parse(backup.st));
      SS = normStats(JSON.parse(backup.ss));
      EXTRA = JSON.parse(backup.ex);
      savePG(); saveST(); saveSS(); saveExtra();
      SESS = null; saveSession();
      try { MREAD = backup.mr ? JSON.parse(backup.mr) : { ids: {} }; } catch (e2) { MREAD = { ids: {} }; }
      saveMREAD();
      MQ.q = ''; MQ.filter = 'all';
      viewDate = backup.vd || todayISO();
      Q = { order: [], idx: 0, ratings: {}, start: 0, total: 0, revealed: false, active: false, finished: false };
    } catch (e) {}

    var pass = out.filter(function (x) { return x.pass; }).length;
    var pre = document.getElementById('selftest');
    if (pre) {
      pre.style.display = 'block';
      pre.textContent = '[SELFTEST] ' + pass + '/' + out.length + ' 通过\n' +
        out.map(function (x) { return (x.pass ? '[PASS] ' : '[FAIL] ') + x.name + (x.info ? ' | ' + x.info : ''); }).join('\n') +
        '\n[END]';
    }
    document.title = 'SELFTEST ' + pass + '/' + out.length;
    window.__SELFTEST__ = { pass: pass, total: out.length, items: out };
    return out;
  }

  function runPersistCheck() {
    var raw = store.raw(K.mark);
    var pre = document.getElementById('selftest');
    var ok = !!raw;
    var info = ok ? '已读到上次写入的标记 ' + raw.slice(0, 60) : '未读到任何标记';
    if (pre) {
      pre.style.display = 'block';
      pre.textContent = '[SELFTEST] ' + (ok ? '1/1' : '0/1') + ' 通过\n' +
        (ok ? '[PASS] ' : '[FAIL] ') + '跨进程本地存储可读 | ' + info + '\n[END]';
    }
    document.title = 'SELFTEST-PERSIST ' + (ok ? '1/1' : '0/1');
    window.__SELFTEST__ = { pass: ok ? 1 : 0, total: 1, items: [{ name: '跨进程本地存储可读', pass: ok, info: info }] };
  }

  /* ------------------------------------------------------------------ */
  /* 启动                                                               */
  /* ------------------------------------------------------------------ */
  function init() {
    loadAll();
    bind();
    if (!storageOK) {
      TOAST_WARN();
    }
    switchTab('today');
    var q = String(location.search || '');
    if (/selftest=persist/.test(q)) { runPersistCheck(); return; }
    if (/selftest=1/.test(q)) { runSelfTest(); return; }
    /* 常规启动：记录本次打卡（用于连续打卡统计） */
    if (PLAN.length) checkin(todayISO());
  }
  function TOAST_WARN() {
    setTimeout(function () {
      toast('本浏览器禁用了本地存储，数据仅本次有效，请及时导出备份');
    }, 600);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();

  window.__APP__ = {
    plan: function () { return PLAN; },
    cards: allCards,
    progress: function () { return PG; },
    stats: function () { return SS; },
    cardState: function () { return ST; },
    dueFor: dueFor,
    buildExport: buildExport,
    importPayload: importPayload,
    cardKey: cardKey,
    materials: function () { return MATERIALS; },
    materialRead: function () { return MREAD; },
    openMaterial: openMaterial,
    addDays: addDays
  };
})();

</script>

<script>
/* PWA：注册 Service Worker，实现离线缓存（仅在 http/https 或 localhost 下生效） */
(function () {
  if (!('serviceWorker' in navigator)) return;
  if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') return;
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(function (e) {
      if (window.console && console.warn) console.warn('[PWA] Service Worker 注册失败：', e);
    });
  });
})();
</script>
